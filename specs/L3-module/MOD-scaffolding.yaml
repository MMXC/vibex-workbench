meta:
  type: module
  module: generators
  owner: hermes
  created: 2026-04-24
  updated: 2026-04-24
lifecycle:
  current: proposal
  updated: 2026-04-24
display:
  title: scaffolding
  summary: 在目标目录生成最小可跑骨架：
  description: 在目标目录生成最小可跑骨架：
structure:
  parent: vibex-workbench-skeleton
  children:
    - specs/L4-feature/FEAT-bootstrap-generator-smoke.yaml
    - specs/L4-feature/FEAT-scaffold-preview-recovery.yaml
    - specs/L4-feature/FEAT-scaffolding.yaml
  dependencies: []
  impacted_files: []
io:
  input:
    - >-
      - WORKSPACE_ROOT（目标目录）

      - options: {includeAgent: bool, includeFrontend: bool, includePython:
      bool}
  output:
    - |-
      在目标目录生成最小可跑骨架：
      - specs/ 目录（含一份入口 L1 spec）
      - generators/gen.py
      - generators/validate_specs.py
      - spec-engine/validate_chain.py
      - Makefile（含 lint-specs / validate / generate target）
      - frontend/package.json（可选）
      - agent/.env.example（可选）
