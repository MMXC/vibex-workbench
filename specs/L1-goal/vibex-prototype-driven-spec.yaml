---
spec:
  level: L1
  name: vibex-prototype-driven-spec
  title: 原型驱动的 Spec 推导闭环
  parent: null
  version: 0.1.0
  status: draft
  owner: vibex-team
  created: 2026-05-13
  milestone: M8

summary: |
  用户在 VibeX Workbench 定义总目标后，通过 agent 生成大致原型（锚定主题/样式），
  点击「浏览器完善区域」在 Chrome 插件中选区细化，agent 基于原型用 grill-me
  澄清用户意图，导出 HTML 原型片段 + spec YAML，实现 原型→spec推导→精准原型 闭环。

io_contract:
  inputs:
    - name: user_goal
      type: string
      description: 用户在 workbench 输入的总目标描述
    - name: reference_html
      type: file
      description: agent 生成的参考原型 HTML（可选）
  outputs:
    - name: spec_yaml
      type: file
      path: "{workspace_root}/specs/L*-feature/{name}.yaml"
      description: 澄清后导出的 spec YAML 文件
    - name: prototype_html
      type: file
      path: "{workspace_root}/.vibex/specs/prototypes/{name}.html"
      description: 提取的精准原型 HTML

behaviors:
  - id: B1
    trigger: 用户在 workbench 定义总目标
    action: agent 生成大致原型 HTML（锚定主题、颜色、布局骨架）
    note: 原型保证主题/样式基调不跑偏

  - id: B2
    trigger: 用户满意原型，点击「浏览器完善区域」
    action: |
      1. 打开 Chrome 插件 sidepanel
      2. 用户在原型网页或参考页面上选区
      3. agent 分析选区 DOM → 推导提取方向
      4. 用户确认/细化 → 循环直至讲清楚
    note: grill-me 澄清在原型上做，比纯文字表单精准得多

  - id: B3
    trigger: 用户确认提取
    action: |
      1. 生成 .html 原型片段 → .vibex/specs/prototypes/{name}.html
      2. 生成 spec YAML 片段 → 可合并到父 spec
    note: 倒果为因，顺藤摸瓜——从满意结果反推规格

  - id: B4
    trigger: 原型 + spec 就绪
    action: |
      1. workbench 预览区展示 HTML 原型
      2. spec ↔ HTML 互相推导
      3. 精准原型验证 spec 正确性
    note: 互相成就，而非单向推导

sub_specs:
  - name: L2-prototype-extractor
    role: Chrome 插件核心能力
    path: specs/L2-skeleton/L2-prototype-extractor.yaml
  - name: FEAT-prototype-extractor-launcher
    role: workbench 原型抽屉入口按钮
    path: specs/L4-feature/FEAT-prototype-extractor-launcher.yaml

milestones:
  - id: M8
    title: "原型驱动 Spec 推导闭环"
    depends_on: [M3, M5]
    description: |
      ① agent 生成大致原型（M3 scaffold）
      ② Chrome 插件选区提取（M8.1 = L2 + L4 实现）
      ③ grill-me 基于原型澄清（M6 review 能力）
      ④ 导出精准原型 + spec（M5 write 能力）
