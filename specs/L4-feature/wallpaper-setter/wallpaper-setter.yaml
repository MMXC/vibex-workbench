spec_version: "1.0"
type: feature

id: wallpaper-setter-feature
name: 壁纸设置功能
description: 将图片或视频设置为 Windows 桌面壁纸
parent: digital-wallpaper-goal

features:
  - id: set-image-wallpaper
    name: 设置图片壁纸
    description: 使用 Windows API 设置桌面背景
    input:
      - filePath: string
      - style: "fill" | "fit" | "stretch" | "center" | "tile"
    output:
      - success: boolean
      - error: string?
    behavior:
      - 调用 SystemParametersInfo API
      - 支持不同的填充样式
      - 同步设置立即生效

  - id: set-video-wallpaper
    name: 设置视频壁纸
    description: 使用第三方组件实现视频壁纸
    input:
      - filePath: string
      - volume: number (0-100)
      - playback: "loop" | "once"
    output:
      - success: boolean
      - error: string?
    behavior:
      - 使用 DeskCam 或类似方案
      - 后台静默播放
      - 支持音量调节

  - id: clear-wallpaper
    name: 清除壁纸
    description: 恢复系统默认壁纸
    input: {}
    output:
      - success: boolean
    behavior:
      - 使用纯色背景替代
      - 或恢复上次非自定义壁纸

  - id: get-current-wallpaper
    name: 获取当前壁纸
    description: 读取当前系统壁纸路径
    input: {}
    output:
      - filePath: string
      - style: string
    behavior:
      - 读取注册表获取路径
      - 解析填充样式

io_contract:
  input:
    - 壁纸文件路径
    - 设置参数
  output:
    - 操作结果状态
  boundary:
    - Python pywin32 调用
    - Windows API
  behavior:
    - 设置失败回滚
    - 权限不足提示用户

constraints:
  - 仅支持 Windows 10/11
  - 需要管理员权限提示
  - 壁纸切换时间 < 2 秒
  - 视频壁纸需额外依赖
