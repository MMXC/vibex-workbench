  - 增加 wails_filesystem_verification_gate；wails-filesystem 导出 getWailsFilesystemBindingStatus / probeWailsFilesystemListSpecs 供迁槽位前验收
- version: "0.3"
  date: "2026-05-09"
  author: "hermes"
  changes:
  - 关闭首轮 transport_implementation_todos；增加 stable_io_surface_labels；落地 agent-transport 与 protoshellmanifest Wails 绑定
- version: "0.2"
  date: "2026-05-09"
  author: "hermes"
  changes:
  - 补充 transport_implementation_todos，对齐现有实现中的双轨与缺口
- version: "0.1"
  date: "2026-05-09"
  author: "hermes"
  changes:
  - 初始 proposal：架构层传输适配契约（收敛模块 / 发散功能）
