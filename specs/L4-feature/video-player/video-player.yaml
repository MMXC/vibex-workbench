spec_version: "1.0"
type: feature

id: video-player-feature
name: 视频播放功能
description: 视频缩略图提取和预览播放
parent: digital-wallpaper-goal

features:
  - id: extract-thumbnail
    name: 视频缩略图提取
    description: 从视频文件中提取指定帧作为缩略图
    input:
      - filePath: string
      - timestamp: number (秒，默认 0)
      - size: {width, height}
    output:
      - thumbnail: Buffer
      - duration: number (视频时长)
      - width: number
      - height: number
    behavior:
      - 提取第一帧作为默认缩略图
      - 支持自定义时间点
      - 异步处理

  - id: video-preview
    name: 视频预览
    description: 在预览窗口中播放视频
    input:
      - filePath: string
      - autoPlay: boolean
      - loop: boolean
    output:
      - playerElement: HTMLVideoElement
    behavior:
      - 支持播放/暂停
      - 支持进度拖拽
      - 支持音量控制

  - id: get-video-info
    name: 获取视频信息
    description: 读取视频元数据
    input:
      - filePath: string
    output:
      - duration: number
      - width: number
      - height: number
      - fps: number
      - codec: string
    behavior:
      - 支持 MP4, AVI, MKV, MOV, WebM
      - 快速元数据读取

io_contract:
  input:
    - 视频文件路径
    - 播放参数
  output:
    - 缩略图数据
    - 视频元数据
  boundary:
    - Python opencv 处理
    - Electron 渲染进程显示
  behavior:
    - 视频解码失败显示错误
    - 支持全屏播放

constraints:
  - 最大支持 4K 视频
  - 支持的编码格式 H.264, H.265, VP9
  - 缩略图提取时间 < 3 秒
  - 仅支持单视频播放
