---
spec:
  version: "0.1"
  level: "4_feature"
  name: "FEAT-agent-tool-routing-graph"
  parent: "MOD-ide-chrome"
  status: "proposal"

display:
  title: "Agent 工具路由图"
  summary: "让 Go agent 先生成可审查的执行图，再路由到内置或自定义工具。"
  description: |
    将 agent 从直接生成代码转为 plan graph -> tool routing graph -> confirmed execution。
    用户可以看到每个节点会由哪个工具处理，并能手动注册自定义工具作为路由目标。

structure:
  parent: "MOD-ide-chrome"
  children:
    - "SLICE-agent-plan-graph-router-api"
    - "SLICE-agent-custom-tool-registry"
  dependencies:
    - "FEAT-ide-agent-panel"
    - "FEAT-workspace-runtime-safety"
    - "FEAT-workspace-design-prototype-gate"
    - "FEAT-agent-task-state-machine"
  impacted_files:
    - "agent/vibex/domain/toolrouting/*.go"
    - "agent/cmd/web/tool_routing_handlers.go"
    - "agent/cmd/web/server.go"
    - "frontend/src/lib/services/tool-routing-client.ts"
    - "frontend/src/lib/stores/spec-slot-session-store.ts"
    - "frontend/src/lib/components/workbench/SpecSlotDrawer.svelte"
    - "frontend/src/lib/components/workbench/SpecSlotVisualPane.svelte"
    - "frontend/src/lib/components/workbench/SpecSlotA2UIStage.svelte"

io:
  input:
    - "用户实现意图、当前 spec path、slot_id、已有 workspace/tool 配置、右侧 AI 操作台的 workbench context"
  output:
    - "PlanGraph JSON"
    - "ToolRoutePreview JSON"
    - "FireworksGraph UI model（A2UI 主体的一种渲染模式，可与卡片/HTML 原型并列）"
    - "前端可映射的 A2UI 确认组件模型（由 slot_id、plan node outputs 与 route decisions 推导）"
    - "可注册但默认不执行的 custom tool metadata"
  boundary: "本 feature 只定义计划图和工具路由，不默认执行任意自定义命令，不绕过用户确认写代码。通用 AI 操作台负责全局编排，SpecSlotDrawer 负责单槽位深度澄清。"

constraints:
  rules:
    - id: "C1"
      name: "Plan-first"
      rule: "实现类请求必须优先形成 plan graph 和 tool route preview。"
      verification: "agent tools 中存在 plan_graph_create 与 tool_route_preview。"
    - id: "C2"
      name: "No implicit custom execution"
      rule: "自定义工具 MVP 只作为 metadata routing target，不执行任意 command。"
      verification: "custom_tool_register 仅允许 execute_mode=metadata_only。"
    - id: "C3"
      name: "Human confirmation gate"
      rule: "写文件、执行命令或生成代码前必须经过可见路由图确认。"
      verification: "PlanGraph 中包含 gate.confirm 节点。"
    - id: "C4"
      name: "Slot-aware routing"
      rule: "Spec 槽位澄清必须携带 slot_id，并路由到结构、I/O、约束、原型、实现等专用工具。"
      verification: "plan_graph_create 支持 slot_id，spec-slot-routing mode 返回对应 slot 节点。"
    - id: "C6"
      name: "Right rail orchestration"
      rule: "通用 AI 操作台的实现/验证/治理请求必须可通过 plan_graph_create 和 tool_route_preview 展示可审查路线。"
      verification: "用户在右侧操作台请求实现或验证时，回复包含 plan graph 或 route preview 摘要。"
    - id: "C5"
      name: "AI fill area"
      rule: "内置/自定义工具描述必须预留 ai_fill_area，供 agent 个性化补充工具说明、约束和提示。"
      verification: "ToolDescriptor/CustomToolConfig 包含 ai_fill_area。"
    - id: "C7"
      name: "SpecSlotDrawer A2UI core"
      rule: "SpecSlotDrawer 右侧在 Current Slot 与 Fireworks 之间须以 A2UI 为核心区：按槽位生成可确认的可视化组件（卡片、HTML prototype 壳、或 Fireworks 静态/路由图）；底部固定 确认、微调、草稿、取消、重新生成。"
      verification: "槽位抽屉打开后主体区为 A2UIStage，操作条常驻；prototype 槽位优先展示 HTML 预览壳，其它槽位可与 Fireworks 并排或主显其一。"
    - id: "C8"
      name: "Prototype slot UI workflow gate"
      rule: "当 slot_id=prototype 时，A2UIModel 须携带 ui_workflow_gate（requiredChecks/failedChecks/canCommitPrototype）；toA2UIModel 结合会话 Intent 与 UI Spec 快照计算 gate；未通过 gate 时底部确认语义为「补充澄清」，design-kit 写盘动作禁用。"
      verification: "Intent 缺失时 A2UI 展示 checklist；extract/scaffold 在 gate fail 且 confirm=true 时返回错误；通过后 canCommitPrototype=true。"
    - id: "C9"
      name: "Iteration graph in right drawer"
      rule: "SpecSlotDrawer 详情抽屉须展示迭代动态图：run/planning/tool/result 节点、动态连线、当前游标高亮、错误路径强调，并支持历史折叠与节点详情查看。"
      verification: "提交后可实时看到 run.started -> planning -> tool.called/tool.completed -> run.completed|run.failed 的可视化轨迹。"
  forbidden:
    - "把用户自定义工具注册成默认可执行 shell 命令"
    - "跳过路由图直接调用 write_file/batch 生成代码"

prototype:
  file: ""
  validates: []
  status: none

meta:
  type: "feature"
  module: "agent"
  owner: "hermes"
  created: "2026-05-03"
  updated: "2026-05-05"

lifecycle:
  current: "proposal"
  updated: "2026-05-05"

io_contract:
  input: |
    用户向右侧 AI 操作台或 SpecSlotDrawer 提出实现、生成、验证、Spec 槽位澄清或工具扩展意图。
  output: |
    Go agent 先产出可审查的执行图和工具路由预览，再由用户确认后进入执行。
  boundary: |
    不替代现有 LLM tool loop；作为其前置计划与路由层。
  behavior:
    - "创建 PlanGraph"
    - "路由每个节点到内置或自定义工具"
    - "展示需要确认的节点"
    - "通用 AI 操作台请求生成全局 plan graph"
    - "按 slot_id 生成槽位专用计划图，并由 SpecSlotDrawer 展示"
    - "转换 FireworksGraph 供前端动态图展示"
    - "推导 A2UI 模型供 SpecSlotDrawer 中央确认区渲染"
    - "保存自定义工具 metadata"

content:
  behaviors:
    - id: "B1"
      trigger: "用户请求实现某个 spec"
      action: "agent 调用 plan_graph_create 生成执行图"
      expected_result: "返回 inspect/design/route/confirm/validate 等节点"
      error_handling: "目标 spec 缺失时仍返回可编辑图，并标记 inspect 节点待补充"
    - id: "B2"
      trigger: "用户或 agent 需要选择工具"
      action: "调用 tool_route_preview 根据节点 kind 找到 tool"
      expected_result: "每个节点显示 tool、source、是否需要确认"
      error_handling: "无匹配工具时返回 warning，不执行"
    - id: "B3"
      trigger: "用户添加自定义工具"
      action: "保存 .vibex/tools/<name>.json metadata"
      expected_result: "工具出现在 tool registry 中，可参与后续路由"
      error_handling: "非法 name/kind 或 execute_mode 被拒绝"
    - id: "B4"
      trigger: "用户点击 Spec 槽位（结构/输入/输出/约束/原型/实现）"
      action: "创建 mode=spec-slot-routing 且包含 slot_id 的 PlanGraph，并生成 route preview / FireworksGraph"
      expected_result: "SpecSlotDrawer 展示槽位澄清对话、路由决策和动态图谱"
      error_handling: "tool routing API 不可用时保留对话入口并显示可恢复错误"
    - id: "B5"
      trigger: "用户在右侧 AI 操作台请求实现、验证或治理"
      action: "agent 先调用 plan_graph_create，再调用 tool_route_preview，必要时请求用户确认"
      expected_result: "ConversationPanel 显示计划/路由摘要，确认后再进入执行"
      error_handling: "缺少工具时返回 custom tool metadata 草案，不直接执行 shell"
    - id: "B6"
      trigger: "用户在 SpecSlotDrawer 中查看某一槽位"
      action: "生成 spec-slot-routing 的 PlanGraph 与 RoutePreview，并映射为 A2UI 核心区组件；Fireworks 仅作为路由可视化子模式"
      expected_result: "右侧中间为可确认的 A2UI 卡片或 HTML prototype 壳；底部固定确认、微调、草稿、取消、重新生成"
      error_handling: "API 不可用时 A2UI 显示降级说明，仍保留操作条与左侧对话"
    - id: "B7"
      trigger: "用户在 SpecSlotDrawer 里发起一次槽位对话/执行"
      action: "前端消费 SSE 运行事件并维护 iterationNodes/iterationEdges/iterationCursorId，详情抽屉渲染动态图和节点详情"
      expected_result: "用户可见可追踪的多步闭环路径，并可快速定位失败节点与最近一次修复回路"
      error_handling: "无事件或事件缺失时显示空态提示，不阻塞主流程"

  test_scenarios:
    - id: "TC-1"
      scenario: "创建计划图"
      given: "goal 和 spec_path"
      when: "POST /api/agent/plan-graph"
      then: "返回 graph.version=plan-graph/v1 且包含 gate.confirm 节点"
      evaluation: "不写入代码文件"
    - id: "TC-2"
      scenario: "注册自定义工具"
      given: "execute_mode=metadata_only"
      when: "POST /api/agent/tools/custom"
      then: "写入 .vibex/tools/<name>.json 并可被 GET /api/agent/tools 读取"
      evaluation: "非 metadata_only 被拒绝"
    - id: "TC-3"
      scenario: "创建槽位计划图"
      given: "goal/spec_path/slot_id"
      when: "POST /api/agent/plan-graph mode=spec-slot-routing"
      then: "返回 graph.slot_id 且节点匹配当前槽位"
      evaluation: "RoutePreview 命中内置槽位工具，且工具包含 ai_fill_area"
    - id: "TC-4"
      scenario: "右侧操作台展示全局路由预览"
      given: "用户输入 '实现当前 spec 并验证'"
      when: "agent 收到 [Workbench Context] 与 focused spec"
      then: "先返回 PlanGraph/RoutePreview 摘要，再要求确认写入或执行"
      evaluation: "未确认前不写文件、不执行自定义工具"
    - id: "TC-5"
      scenario: "右侧详情抽屉展示迭代动态图"
      given: "用户在槽位会话中触发一次 run，且包含至少 1 次 tool.called/tool.completed"
      when: "前端接收 SSE run/tool 事件"
      then: "抽屉显示动态连线、当前节点高亮、错误边样式，并可展开历史与查看节点详情"
      evaluation: "轨迹顺序与 SSE 事件一致；失败节点 detail 可读"

