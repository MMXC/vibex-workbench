    - frontend/src/lib/components/workbench/SpecViewer.svelte
io:
  input:
    - |-
      用户在 SpecViewer 点击「编辑」并修改 YAML 内容后点击「保存」。
      调用 `wailsWriteSpecFile(workspaceRoot, path, content)`（Wails 绑定或同源 HTTP `/api/workspace/specs/write` 经壳反代，详见 FEAT-spec-write L4）。
  output:
    - |-
      保存成功：SpecViewer 退出编辑模式并刷新展示；失败：保留编辑态并展示错误。
      （不要求独立 SvelteKit `specs/write/+server.ts`。）
  boundary: |-
    只负责前端编辑 UI 与写盘调用约定。
    agent 侧 `workspaceSpecWriteHandler` 由壳代理；桌面优先 Wails `WriteSpecFile`。
constraints:
  rules: []
  forbidden: []
prototype:
  file: .vibex\ppt\FEAT-spec-write_L5.html
  validates: []
  status: draft
  intent:
    target_user: VibeX 项目开发者，在浏览器中编辑 spec YAML 文件
    business_goal: 实现 SpecViewer 内联编辑功能，支持一键保存到工作区
    primary_action: 点击「编辑」→ 修改 YAML 内容 → 点击「保存」
    success_criteria: "wailsWriteSpecFile 成功，切换只读模式并给出成功反馈"
  ui_spec:
    page_purpose: 展示单个 spec 的内容，提供编辑/保存/取消交互能力
    sections:
      - name: 工具栏
        component_type: 按钮组
        priority: high
      - name: 内容区
        component_type: 条件渲染卡片
        priority: high
    states:
      - loading
      - empty
      - error
      - normal
    responsive:
      desktop: 完整工具栏横向排列，Monaco 编辑区占满可用高度
      mobile: 工具栏垂直堆叠，编辑器自适应宽度
    acceptance:
      - 点击「编辑」后显示 Monaco 编辑器，「保存」「取消」按钮可见
      - 保存路径符合 wailsWriteSpecFile 约定（完整 workspaceRoot + 相对 path）
      - 保存成功 → 切换只读 + toast；失败 → 显示 saveErr，保持编辑状态
      - 取消操作 → 恢复原始 content，不调用 save API
io_contract:
  input: |
    用户在 SpecViewer 点击「编辑」并修改 YAML 内容后点击「保存」。
    wailsWriteSpecFile(workspaceRoot, path, content)
  output: |
    成功后切换到只读模式；失败则显示错误并保持编辑。
  boundary: |
    只负责前端编辑 UI 与写盘封装。
    HTTP 路径由壳反代 agent；Wails 路径直写磁盘。
content:
  file_path: frontend/src/lib/components/workbench/SpecViewer.svelte
  implementation_boundary:
    allowed:
      - 编辑模式开关与 Monaco Editor（YAML）绑定内容
      - 保存调用 `wailsWriteSpecFile`（与 FEAT-spec-write L4 传输约定一致）
      - 保存成功 → 切换只读模式并刷新文本
      - 保存失败 → 显示错误信息，保持编辑
      - 取消 → 丢弃编辑状态，恢复原始 content
    not_allowed:
      - 修改 spec 列表读取逻辑（SpecExplorer.svelte 职责）
      - 修改 spec 图谱渲染逻辑（SpecGraph.svelte 职责）
      - 实现 YAML 语法校验（由 lint-specs 负责）
  changes:
    - section: state
      current: loading, content, fetchErr
      add: |
        editing: boolean         # 编辑模式开关
        editContent: string      # 编辑中的内容（区分原始 content）
        saveLoading: boolean     # 保存中状态
        saveErr: string | null  # 保存错误信息
        hasUnsavedChanges: boolean  # 是否有未保存修改
    - section: UI
      add: |
        工具栏按钮：
        - 只读模式：「编辑」按钮 → 进入编辑模式
        - 编辑模式：「保存」「取消」按钮

        条件渲染：
        - 只读：原文展示 + 「编辑」
        - 编辑：MonacoEditor + 工具栏
    - section: save handler
      current: "await wailsWriteSpecFile(root, relPath, editContent)"
      note: "实现见 SpecViewer.svelte；浏览器 dev 下 wails-filesystem 内部走 POST /api/workspace/specs/write"
    - section: cancel handler
      add: |
        editing = false;
        editContent = content;  // 恢复原始内容
  code_patterns:
    - name: MonacoEditor 组件
      snippet: |
        import MonacoEditor from '$lib/components/workbench/MonacoEditor.svelte';
        <MonacoEditor bind:value={editContent} language="yaml" />
  test_scenarios:
    - id: TC-write-1
      scenario: 编辑 → 保存 → 只读模式
      given: SpecViewer 加载 specs/L1-goal/vibex-workbench-mvp.yaml
      when: 点击编辑 → 修改 content → 点击保存
      then: wailsWriteSpecFile 成功，退出编辑模式
      evaluation: 磁盘内容与 editContent 一致
    - id: TC-write-2
      scenario: 保存 API 错误
      given: API 返回 500
      when: 点击保存
      then: saveErr 显示错误信息，editing=true，文件未写入
      evaluation: 用户可继续修改或取消
    - id: TC-write-3
      scenario: 取消编辑
      given: 已修改 editContent
      when: 点击取消
      then: editing=false，editContent 恢复为原始 content
      evaluation: 未调用 save API
