---
spec:
  version: "0.1"
  level: "5_slice"
  name: "SLICE-agent-plan-graph-router-api"
  parent: "FEAT-agent-tool-routing-graph"
  status: "proposal"

display:
  title: "计划图路由 API"
  summary: "提供 PlanGraph 创建和 tool route preview 的 Go 后端接口与 agent tools。"
  description: "在 agent 后端新增 toolrouting domain，并挂载 HTTP API 与 LLM function tools。"

structure:
  parent: "FEAT-agent-tool-routing-graph"
  children: []
  dependencies:
    - "agent/cmd/web/server.go"
    - "agent/vibex/domain/registry.go"
  impacted_files:
    - "agent/vibex/domain/toolrouting/types.go"
    - "agent/vibex/domain/toolrouting/registry.go"
    - "agent/vibex/domain/toolrouting/specs.go"
    - "agent/cmd/web/tool_routing_handlers.go"
    - "agent/cmd/web/main.go"

io:
  input:
    - "goal/spec_path/mode/slot_id"
    - "PlanGraph JSON"
  output:
    - "PlanGraph"
    - "RoutePreview"
    - "供前端映射 A2UI 的语义：PlanNode.outputs、node.kind、route decision 与内置工具描述中的可视化输出提示（等价 a2ui_component_hint；MVP 可由前端推导）"
    - "slot_id=prototype 时 A2UIModel.uiWorkflowGate（requiredChecks/failedChecks/canCommitPrototype/stage）由当前 spec YAML 推导"
  boundary: "只做计划图创建和路由预览，不执行写盘节点。"

constraints:
  rules:
    - rule: "HTTP 与 agent tool 使用同一套 toolrouting.Registry"
      detail: "避免 UI 和 LLM 工具看到不同的路由结果。"
    - rule: "route preview 遇到无匹配工具时只返回 warning"
      detail: "不得自动降级为 bash/write_file。"
  forbidden:
    - "在 route preview 阶段执行节点"

prototype:
  file: ""
  validates: []
  status: none

meta:
  type: "slice"
  module: "agent"
  owner: "hermes"
  created: "2026-05-03"
  updated: "2026-05-04"

lifecycle:
  current: "proposal"
  updated: "2026-05-04"

io_contract:
  input: |
    goal/spec_path/slot_id 或已有 PlanGraph。
  output: |
    JSON 格式的 PlanGraph 或 RoutePreview。
  boundary: |
    本 slice 不负责前端图形编辑器，也不负责执行自定义工具。
  behavior: |
    1. 创建 toolrouting.Registry
    2. 生成 PlanGraph
    3. 按 node.kind/node.tool 路由
    4. 返回可审查 JSON

content:
  file_path: "agent/vibex/domain/toolrouting/*.go"
  file_type: "go"
  generation_rules:
    - rule: "PlanGraph is declarative"
      detail: "Graph 节点表达工作意图，不直接包含大段代码。"
    - rule: "Router is deterministic"
      detail: "优先 node.tool 精确匹配，其次 node.kind 匹配。"
    - rule: "Custom tools are metadata-only"
      detail: "MVP 不执行用户提供 command。"
    - rule: "Spec slot graph is explicit"
      detail: "mode=spec-slot-routing 时必须保留 slot_id，并生成槽位专用节点。"
    - rule: "A2UI mapping hints"
      detail: "节点 outputs 与工具 description 应能推断前端 A2UI 组件类型（如 prototype 对应 html_prototype_shell、implementation 对应 route_graph / fireworks）。"
  verification:
    commands:
      - "cd agent && go test ./vibex/domain/toolrouting"

changelog:
  - version: "0.1"
    date: "2026-05-03"
    author: "agent"
    changes:
      - "新增计划图路由 API slice"
  - version: "0.2"
    date: "2026-05-04"
    author: "agent"
    changes:
      - "补充 slot_id 入参与 spec-slot-routing 验证命令"
  - version: "0.3"
    date: "2026-05-04"
    author: "agent"
    changes:
      - "声明 PlanGraph/Route 输出需支持前端 A2UI 映射（outputs + 工具描述语义，等价 a2ui_component_hint）"
  - version: "0.4"
    date: "2026-05-05"
    author: "agent"
    changes:
      - "prototype 槽位输出 uiWorkflowGate 契约"

---
