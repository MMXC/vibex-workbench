prototype:
  file: ''
  validates: []
  status: none

io_contract:
  input: |
    SpecAddChildCard 发出的 create-child-spec intent：
    parent_name、parent_path、target_level、target_dir、existing_children、current_workspace。
  output: |
    右侧 agent 线程展示推荐 spec 草稿、澄清问题、确认写入动作和验证结果摘要。
    SpecSlotDrawer 展示槽位对话与 A2UI 确认区：prototype 优先 HTML 壳，其它槽位可主显卡片与 Fireworks；操作条固定。
  boundary: |
    只管从图谱 intent 到 agent 澄清线程的上下文组装和确认流程。
    SpecSlotDrawer 槽位会话与之对齐：A2UI 确认不等于写盘。
    不负责 agent 模型实现、不负责完整聊天存储、不负责所有 spec 模板字段穷举。
  behavior: |
    1. 点击 + 后在右侧线程追加 create-child-spec 系统上下文
    2. agent 基于 parent spec、目标层级和 sibling names 推荐草稿
    3. agent 必须先提出必要澄清问题
    4. 用户确认后才调用 specs/write
    5. 写入后运行 make validate，并把结果归类展示
    6. SpecSlotDrawer 中用户确认 A2UI 候选时仅追加会话/摘要，不自动 specs/write；写盘仍走显式确认与 API
    7. prototype 槽位 Design Kit 工具条写入 `.vibex/prototypes` 须经 extract/scaffold 的 confirm；将 `prototype.file` 写入当前 spec 须经对话确认后的 specs/write；「关联 spec」预填不得单步静默写盘

content:
  file_path: "frontend/src/lib/components/workbench/SpecAgentClarification.svelte"
  file_type: "svelte"

  implementation_boundary:
    allowed:
      - "create-child-spec intent to thread message mapping"
      - "agent draft preview state"
      - "confirm/cancel actions"
      - "specs/write API call after explicit confirmation"
      - "slot 抽屉 A2UI 确认、微调预填对话、草稿摘要、取消与重新生成路由预览"
    forbidden:
      - "未确认时写入 specs/"
      - "绕过 agent 线程直接静默创建文件"
      - "在前端硬编码完整 L1-L5 模板内容"
      - "修改底层 chat streaming protocol"

  generation_rules:
    - rule: "Context package"
      detail: "发送给 agent 的上下文必须包含 parent spec 摘要、target_level、target_dir、existing_children、requested_user_goal"
    - rule: "Clarify before write"
      detail: "agent 至少需要输出草稿摘要和待确认字段，用户确认前不得调用 specs/write"
    - rule: "Filename proposal"
      detail: "agent 推荐 filename 时必须避免与 existing_children 和目录内现有文件冲突"
    - rule: "SpecSlotDrawer A2UI"
      detail: "槽位右侧中间为 A2UI 核心区；Fireworks 为路由可视化子模式；底部操作条常驻。"
    - rule: "Prototype HTML first"
      detail: "prototype 槽位优先生成或展示 HTML 预览壳（sandbox），完整内容由对话与 agent 产出后再替换；物料路径须与 `.vibex/design/DESIGN.md` 及 prototypes 目录约定一致（见 FEAT-workspace-design-prototype-gate）。"

  verification:
    commands:
      - "make validate"
      - "npm --prefix frontend run build"
    manual_checks:
      - "点击 + L4 后右侧线程出现 parent 与 target_level 上下文"
      - "未点确认时不会写入任何新 YAML"
      - "确认后新 spec 写入目标目录并刷新左侧树/中央图谱"
      - "打开 SpecSlotDrawer 后右侧可见 A2UI 卡片区与固定操作条；点「重新生成」会刷新路由预览"
      - "prototype 槽位可见 HTML 预览壳（无脚本时安全展示）"
    failure_conditions:
      - "点击 + 后直接写盘"
      - "agent 草稿缺少 parent 字段"
      - "validate 失败只展示原始长日志，没有分类"
      - "取消澄清后仍保留待写入副作用"

  dependencies:
    - file: "frontend/src/lib/components/workbench/AiChatColumn.svelte"
      reason: "右侧 agent 线程承载区域"
    - file: "frontend/src/lib/components/workbench/SpecSlotDrawer.svelte"
      reason: "槽位抽屉与会话"
    - file: "frontend/src/lib/components/workbench/SpecSlotA2UIStage.svelte"
      reason: "A2UI 核心区渲染"
    - file: "frontend/src/lib/components/workbench/SpecSlotPrototypeKitBar.svelte"
      reason: "prototype 槽位设计物料库工具条（与澄清写盘边界对齐）"
    - file: "frontend/src/lib/components/workbench/Composer.svelte"
      reason: "用户补充澄清和确认动作"
    - file: "agent/cmd/web/workspace_handlers.go"
      reason: "specs/write 与 run-make API"
    - file: "skills/spec-first-workflow/SKILL.md"
      reason: "agent 生成子 spec 时遵循 L1-L5 工作流"
    - file: "skills/spec-first-workflow/validation-and-failure.md"
      reason: "验证失败分类规则"

