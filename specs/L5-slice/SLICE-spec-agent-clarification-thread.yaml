  - SpecSlotDrawer 右侧 A2UI 核心区展示按槽位生成的可视化确认组件（卡片、HTML prototype 壳、Fireworks/路由图）；底部固定 确认、微调、草稿、取消、重新生成；prototype 槽位优先 HTML 预览。
  boundary: '只管从图谱 intent 到 agent 澄清线程的上下文组装和确认流程；SpecSlotDrawer 的槽位会话与之对齐（澄清先于写盘、用户显式确认）。

    不负责 agent 模型实现、不负责完整聊天存储、不负责所有 spec 模板字段穷举。'

