io:
  input:
    - L1 goal spec（vibex-workbench-mvp）
  output:
    primary: 本 spec YAML（L2 Skeleton 治理文档）
    readable_form: .vibex/ppt/vibex-workbench-skeleton.html
    description: 本 spec 即产出物，供 L3/L4 spec 作者查阅的架构指南。ppt_file 为可读性验证载体。
  boundary: L2 定义技术选型和模块划分，不定义模块内部实现（L3 职责）。
  verification:
    criteria:
      - PPT 能讲清楚项目面貌（目标、约束、现状）
      - PPT 能讲清楚技术路线（tech_stack 选择依据）
      - PPT 能讲清楚模块划分（modules_matrix 及其依赖关系）
      - PPT 能讲清楚缺失模块（missing_modules 清单 + why-not）
      - 所有 L3 spec 必须有 parent 指向本 spec（make validate 检查）
      - modules_matrix 中的 module 必须覆盖所有 workspace/ 核心目录
      - 无循环依赖（make validate 检查）
    regression: true
    method: 用户通过 PPT 自查 + make validate 自动回归
  degradation:
    on_incomplete_spec:
      output: missing_modules_report.yaml（即使不完整也输出）
      action: "标注 status: missing，继续提供服务"
    on_validation_failure:
      output: why_not_report.yaml（含 why-not 分析 + 修复建议）
      action: 引导修复，不阻塞开发流程
    on_ppt_missing:
      output: 本 spec YAML 可直接阅读
      action: 降级为纯文本查阅模式
