---
spec:
  version: "0.1"
  level: "4_feature"
  name: "DATA-scaffold-init"
  parent: "FEAT-scaffolding"
  status: "proposal"
  prototype_ref: ""
meta:
  type: "data_contract"
  owner: "user"
  created: "2026-05-15"
  updated: "2026-05-15"
source_ui_spec: "FEAT-scaffolding"
derived_from: "io: WORKSPACE_ROOT + scaffolding options → 生成骨架文件"
io:
  input:
    - source: "WORKSPACE_ROOT + scaffolding options"
      fields:
        - name: workspaceRoot
          type: string
          required: true
          description: 工作区根目录
        - name: componentType
          type: string
          required: true
          description: "组件类型：agent | frontend | python | full"
        - name: confirmToken
          type: string
          required: true
          description: 用户确认 token（前端生成，防止静默写盘）
  output:
    - source: "在目录生成最小骨架文件，写入结果摘要"
      fields:
        - name: success
          type: boolean
          required: true
          description: 是否成功
        - name: createdFiles
          type: "string[]"
          required: true
          description: 本次创建的文件路径列表
        - name: skippedFiles
          type: "string[]"
          required: false
          description: 因已存在而跳过的文件路径
        - name: errors
          type: "string[]"
          required: false
          description: 错误信息列表（如权限不足）
api:
  endpoint: "POST /api/workspace/scaffold"
  method: "POST"
  description: "scaffolding wizard 前端 POST 到壳反代的 endpoint，由后端生成骨架文件"
constraints:
  - name: confirm_before_write
    rule: "前端必须展示预览并获得用户确认后才发送 confirmToken"
    validation: "无 confirmToken 时 backend 返回 403"
  - name: idempotent
    rule: "已有文件不覆盖，只返回 skippedFiles"
    validation: "重复调用同一 workspace 不破坏已有内容"
