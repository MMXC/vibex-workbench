spec_version: "1.0"
type: feature

id: file-scanner-feature
name: 文件扫描功能
description: 扫描指定目录获取支持的壁纸文件列表
parent: digital-wallpaper-goal

features:
  - id: scan-directory
    name: 目录扫描
    description: 递归扫描目录获取所有壁纸文件
    input:
      - folderPath: string (目录路径)
      - recursive: boolean (是否递归扫描)
      - extensions: string[] (文件扩展名过滤)
    output:
      - files: Array<{path, name, size, type, modified}>
      - total: number (文件总数)
      - errors: string[] (扫描错误列表)
    behavior:
      - 支持的文件格式
      - 过滤隐藏文件和系统文件
      - 排序方式：名称/大小/时间

  - id: filter-files
    name: 文件过滤
    description: 根据类型和条件过滤文件
    input:
      - files: File[]
      - filterType: "image" | "video" | "all"
      - minSize: number
      - maxSize: number
    output:
      - filteredFiles: File[]
    behavior:
      - 支持多条件组合过滤
      - 实时预览过滤结果

io_contract:
  input:
    - 目录路径
    - 扫描选项
  output:
    - 文件列表元数据
  boundary:
    - 主进程文件操作
    - IPC 返回结果
  behavior:
    - 扫描过程显示进度
    - 支持取消扫描
    - 错误友好提示

constraints:
  - 最大扫描目录深度 10 层
  - 最大文件数量 10000
  - 扫描超时 60 秒
  - 支持中文路径
