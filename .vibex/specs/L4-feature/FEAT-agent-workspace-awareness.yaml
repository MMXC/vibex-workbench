meta:
  id: FEAT-agent-workspace-awareness
  title: Agent Workspace Awareness
  version: "1.0"
  level: L4
  status: spec
  author: vibex-team
  created: "2025-01-15"
  updated: "2025-01-15"
  tags:
    - agent
    - workspace
    - context
    - awareness
    - L4

spec:
  ppt_file: .vibex/ppt/FEAT-agent-workspace-awareness.html

io:
  context_manager:
    type: class
    module: src/agent/context_manager
    methods:
      - get_workspace_context()
    status: upstream_L3

  workspace_context:
    type: class
    module: src/agent/workspace_context
    methods:
      - aggregate()
      - get_file_tree()
      - get_active_files()
      - get_metadata()
    status: this_spec

  awareness_injector:
    type: class
    module: src/agent/awareness_injector
    methods:
      - inject()
      - lazy_load()
    status: this_spec

io_contract:
  awareness_block:
    fields:
      - workspace_path: string
      - file_tree: string[]
      - active_files: string[]
      - metadata: object
      - state: enum[empty, partial, ready]
      - fallback_suggestion: string | null

  next_step_suggestion:
    empty: "Initialize workspace or open a file"
    partial: "Open more files for better context"
    ready: "Ready for agent interaction"

content:
  overview: |
    注入 agent 的 workspace awareness block，让 agent 理解当前工作区上下文，
    智能处理 empty/partial/ready 三种状态，并给出对应的下一步建议。

  workspace_awareness_block:
    description: |
      workspace awareness block 包含：
      1. workspace_path: 当前工作区路径
      2. file_tree: 工作区文件树（可配置深度）
      3. active_files: 当前活跃的文件列表
      4. metadata: 工作区元数据（git branch, package info 等）
      5. state: 上下文状态（empty/partial/ready）
      6. fallback_suggestion: 基于状态的降级建议

  context_state_machine:
    description: |
      三态转换逻辑：
      - empty: workspace_path 为空或无有效文件
      - partial: 有 workspace_path 但文件树不完整
      - ready: 有完整的上下文

  next_step_suggestion:
    description: |
      基于状态的智能降级建议：
      - empty: "Initialize workspace or open a file"
      - partial: "Open more files for better context"
      - ready: "Ready for agent interaction"

constraints:
  - context_size_limit: "8KB max per workspace context"
  - lazy_loading: "awareness block loaded on demand"
  - backward_compatible: "不影响现有 agent 行为"
  - no_breaking_change: "新增接口，不修改现有接口签名"

changelog:
  - version: "1.0"
    date: "2025-01-15"
    changes:
      - Initial spec creation
      - Define workspace_awareness_block structure
      - Define context_state_machine
      - Define next_step_suggestion logic
