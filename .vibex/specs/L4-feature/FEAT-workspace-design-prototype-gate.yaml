spec:
  id: FEAT-workspace-design-prototype-gate
  version: 1.0.0
  title: 工作区设计门禁与原型物料库
  level: L4
  status: review
  spec_file: .vibex/specs/L4-feature/FEAT-workspace-design-prototype-gate.yaml
  ppt_file: .vibex/ppt/FEAT-workspace-design-prototype-gate.html
  type: feature
  author: vibex-system
  created: 2025-01-15
  updated: 2025-01-15
  tags:
    - workspace
    - prototype
    - design-gate
    - material-repository
  summary: |
    工作区设计门禁与原型物料库。核心能力：每仓库维护 DESIGN.md 与 prototypes 物料；
    原型槽提供可操作策略条；spec 与 prototype 修改均经显式确认写盘。
  description: |
    ## 目标
    建立工作区级别的设计门禁机制，确保设计意图与实现同步、可追溯。

    ## 核心功能
    1. **DESIGN.md 双轨维护**：每个仓库根目录维护设计意图文档
    2. **prototypes 物料库**：每个模块维护原型物料目录
    3. **显式确认写盘**：spec 与 prototype 修改需用户确认后写盘
    4. **原型槽策略条**：工作台提供可操作的原型状态策略条

    ## 设计原则
    - 禁止静默覆盖历史版本
    - spec 与 prototype 一对一映射
    - 每次写盘生成版本快照 + diff

  as_is:
    workspace_design_doc: 不存在 DESIGN.md
    prototype_material: 不存在 prototypes/ 目录
    spec_storage: 仅内存/本地 .vibex/specs/
    confirmation: 无确认机制，静默覆盖风险

  to_be:
    design_doc: 每仓库根目录维护 DESIGN.md
    prototype_material: 模块级 prototypes/ 统一管理
    explicit_confirmation: 修改需 diff 展示 + 用户确认
    prototype_slot: ActionStrip 策略条快速访问

  constraints:
    rules:
      - id: no-silent-overwrite
        description: 禁止静默覆盖
        trigger: 修改 DESIGN.md 或 prototype 文件
        action: 弹出 diff 确认对话框
      - id: cross-repo-isolation
        description: 跨仓库隔离
        trigger: 切换工作区
        action: 刷新 ActionStrip，加载当前仓库上下文
      - id: version-rollback
        description: 版本回滚能力
        trigger: 详情抽屉 → 历史版本 → 回滚
        action: 生成新快照，二次确认后回滚

  state_matrix:
    - state: has-prototype
      badge: success
      icon: "✅"
      description: 显示缩略图 + 版本号 + 最后修改时间
      action_strip: 绿色状态条，可点击展开
    - state: empty-prototype
      badge: info
      icon: "📭"
      description: 空状态提示 + "生成原型" 按钮
      action_strip: 灰色状态条 + 创建入口
    - state: loading
      badge: warning
      icon: "⏳"
      description: 骨架屏 + loading 动画
      action_strip: 脉冲动画表示加载中
    - state: error
      badge: danger
      icon: "❌"
      description: 错误提示 + 重试按钮
      action_strip: 红色状态条 + 警告图标

  io:
    file_paths:
      design_md: "{workspace.root}/DESIGN.md"
      prototypes_dir: "{workspace.root}/prototypes/"
      spec_dir: ".vibex/specs/"
    interfaces:
      - name: confirm-write
        type: dialog
        input: file_path, new_content, old_content
        output: confirmed: boolean
      - name: get-prototype-state
        type: query
        input: spec_id
        output: state: prototype_state
      - name: rollback-version
        type: action
        input: file_path, target_version
        output: success: boolean

  acceptance:
    design_md_generation:
      - id: AC-1
        description: spec 变更可生成/更新 DESIGN.md
        criteria: 内容完整，包含设计意图与变更原因
      - id: AC-2
        description: DESIGN.md 修改需 diff 展示
        criteria: 用户可见变更前后对比
    prototype_management:
      - id: AC-3
        description: prototypes/ 目录按模块组织
        criteria: 与 spec 一一对应，可追溯
      - id: AC-4
        description: 原型槽显示正确状态
        criteria: 三态（has/empty/error）覆盖完整
    explicit_confirmation:
      - id: AC-5
        description: 修改需用户确认后才写盘
        criteria: 无静默覆盖，有变更记录
      - id: AC-6
        description: 支持版本回滚
        criteria: 可回滚到任意历史版本

  four_perspectives:
    cto:
      - 设计意图可追溯、可审计
      - 跨仓库设计资产统一管控
      - 降低知识流失风险
    developer:
      - DESIGN.md 即设计文档，减少文档维护负担
      - 原型物料快速访问，提升开发效率
      - spec ↔ prototype 双向跳转
    tester:
      - 基于 spec 设计验收用例
      - 原型变更触发测试用例更新提示
      - diff 对比便于回归分析
    user:
      - 原型槽提供直观的原型预览
      - 详情抽屉快速访问设计上下文
      - 版本回滚提升使用信心

  decisions:
    recommended:
      - dimension: 存储位置
        choice: 每仓库根目录 DESIGN.md
        reason: 便于 Git 管理，与代码同生命周期
      - dimension: 确认时机
        choice: 修改后立即确认写盘
        reason: 降低数据丢失风险
      - dimension: 版本快照
        choice: 每次写盘生成快照 + diff
        reason: 支持回溯，高风险场景必须
      - dimension: 原型关联
        choice: spec.id → prototype 一对一映射
        reason: 多对多增加歧义，一对一更清晰
    alternatives:
      - dimension: 存储位置
        choice: 统一 .vibex/design/ 集中存储
        reason: 集中管理但不便于 Git 追踪
      - dimension: 确认时机
        choice: 批量确认（定时/退出时）
        reason: 便利性高但风险也高
      - dimension: 版本快照
        choice: 仅保留最新版本
        reason: 存储空间小但无历史追溯
    cost_estimate:
      development: 3 人天
      testing: 2 人天
      documentation: 1 人天
      total: 6 人天
    risk_level: 中
    risk_factors:
      - 文件系统 I/O 依赖
      - 无网络依赖，风险可控

  execution:
    milestones:
      - phase: 1-design-doc
        title: DESIGN.md 模板与生成逻辑
        duration: 1 人天
        deliverable: 设计文档模板 + spec → DESIGN.md 转换工具
      - phase: 2-prototype-material
        title: prototypes/ 目录结构与关联
        duration: 1 人天
        deliverable: 目录规范 + spec ↔ prototype 映射机制
      - phase: 3-confirmation-dialog
        title: 确认对话框与 diff 展示
        duration: 1 人天
        deliverable: 确认组件 + diff 展示 + 版本快照
      - phase: 4-action-strip
        title: ActionStrip 原型槽策略条
        duration: 2 人天
        deliverable: 策略条组件 + 状态管理 + 详情抽屉
      - phase: 5-testing
        title: 集成测试与验收
        duration: 2 人天
        deliverable: 测试用例 + 验收报告
    owners:
      - role: 前端开发
        responsibility: ActionStrip 组件 + 确认对话框
      - role: 后端开发
        responsibility: 文件 I/O + 版本快照存储
      - role: 测试
        responsibility: 状态矩阵覆盖 + 回滚测试
    rollback:
      strategy: 版本快照本地保留，回滚操作生成反向快照
      trigger: 用户主动回滚或重大缺陷
      verification: 回滚后自动校验文件完整性

  spec_deviation:
    - item: 原型深链 URL 格式
      status: 待确定
      impact: 影响 ActionStrip → 详情抽屉跳转
    - item: 多人并发编辑策略
      status: 待确定
      impact: 影响 DESIGN.md 协作场景

  risks:
    high:
      - id: R-1
        description: DESIGN.md 与 spec 同步不一致
        mitigation: 变更时强制 diff 展示
    medium:
      - id: R-2
        description: 大型原型文件加载性能
        mitigation: 懒加载 + 骨架屏
      - id: R-3
        description: 版本快照存储空间
        mitigation: 差异化存储 + 定期清理策略

  spec_enhancement_questions:
    basic:
      - DESIGN.md 的 Markdown 模板结构是什么？
      - prototypes/ 目录的文件命名规范？
      - spec.id 与 prototype 文件名的映射规则？
      - 确认对话框的 UI 组件是复用还是新建？
      - 版本快照的存储格式（JSON / Git blob）？
      - 历史版本保留期限（7天/30天/永久）？
    advanced:
      - DESIGN.md 修改时是否触发 Git commit？
      - 原型深链 URL 的格式规范？
      - 多人并发编辑同一 DESIGN.md 的冲突策略？
      - ActionStrip 策略条是否支持拖拽排序？
      - 旧版 spec 迁移到 DESIGN.md 的批量工具？
      - spec 与 prototype 双向同步的失败补偿机制？
      - 大型原型文件（>10MB）的加载策略？
      - 回滚后是否自动更新相关引用？
      - 国际化（i18n）场景下 DESIGN.md 的处理？
      - 性能基准：ActionStrip 加载耗时应 ≤？

  changelog:
    - version: 1.0.0
      date: 2025-01-15
      changes:
        - 初始版本，定义核心功能与约束规则
        - 添加状态矩阵与四视角覆盖
        - 添加决策页与执行页
