  - 'frontend/src/lib/components/workbench/SpecDashboardConsole.svelte: dashboard tab'
  - 'frontend/src/lib/components/workbench/CanvasRenderer.svelte: canvas tab'
  - 'frontend/src/lib/components/workbench/ArtifactPanel.svelte: artifacts tab'
  - 'frontend/src/lib/components/workbench/WorkbenchBootstrapPrototype.svelte: bootstrap tab'
  impacted_files:
  - frontend/src/lib/components/workbench/WorkbenchCenterTabs.svelte
