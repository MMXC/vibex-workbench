io:
  input:
  - 用户点击中央 editor tabs：dashboard、canvas、artifacts、spec_text、diff、bootstrap。
  output:
  - WorkbenchCenterTabs.svelte 默认渲染 Spec 总控制台，并可切换到其他中心 pane。
  boundary: 只管 tab 壳和组件挂载。Dashboard、Canvas、ArtifactPanel、SpecViewer 内部逻辑不在本 slice。

constraints:
  rules: []
  forbidden:
  - 修改 CanvasRenderer 内部
  - 修改 ArtifactPanel 内部
  - 在 center tabs 中读取 spec 文件内容

prototype:
  file: '.vibex/prototypes/FEAT-ide-editor-tabs.html'
  validates: []
  status: derived

io_contract:
  input: '用户点击中央 editor tabs：dashboard、canvas、artifacts、spec_text、diff、bootstrap。

    '
  output: 'WorkbenchCenterTabs.svelte 默认渲染 Spec 总控制台，并可切换到其他中心 pane。

    '
  boundary: '只管 tab 壳和组件挂载。Dashboard、Canvas、ArtifactPanel、SpecViewer 内部逻辑不在本 slice。

    '
  behavior_summary: 共 5 个行为步骤，详见 content.behaviors
content:
  file_path: frontend/src/lib/components/workbench/WorkbenchCenterTabs.svelte
  file_type: svelte
  implementation_boundary:
    allowed:
    - TabId 类型
    - tabs 数组
    - active 状态
    - pane component mounting
    - IDE tab 样式
    forbidden:
    - 修改 CanvasRenderer 内部
    - 修改 ArtifactPanel 内部
    - 在 center tabs 中读取 spec 文件内容
  generation_rules:
  - rule: Default tab
    detail: 默认 active 必须为 dashboard，不应默认进入自举原型说明页
  - rule: Dashboard tab
    detail: dashboard tab 挂载 SpecDashboardConsole，用于 L1-L5 总控制台入口
  - rule: Bootstrap tab
    detail: 自举原型作为可选 tab，用于评审产品边界
  - rule: Pane isolation
    detail: 每个 pane 独立滚动/布局，不撑破 WorkbenchLayoutResizable
  verification:
    commands:
    - npm --prefix frontend run build
    manual_checks:
    - 进入 /workbench 默认显示 dashboard tab
    - 点击每个 tab 内容切换
    - 自举原型 tab 可展示当前 MVP 链路
    failure_conditions:
    - 默认不是 dashboard tab
    - 切换 tab 后中心区空白且无提示
    - pane 内容撑破底部 dock 或右侧 panel
  dependencies:
  - file: frontend/src/lib/components/workbench/SpecDashboardConsole.svelte
    reason: dashboard tab
  - file: frontend/src/lib/components/workbench/CanvasRenderer.svelte
    reason: canvas tab
  - file: frontend/src/lib/components/workbench/ArtifactPanel.svelte
    reason: artifacts tab
  - file: frontend/src/lib/components/workbench/WorkbenchBootstrapPrototype.svelte
    reason: bootstrap tab
  behaviors:
  - id: B1
    trigger: 步骤1
    action: active 初始为 dashboard
    expected_result: 正确执行，无异常
    error_handling: 出错时显示 toast 提示，不阻塞其他交互
  - id: B2
    trigger: 步骤2
    action: 点击 tab 更新 active
    expected_result: 视图/状态正确切换
    error_handling: 出错时显示 toast 提示，不阻塞其他交互
  - id: B3
    trigger: 步骤3
    action: canvas 渲染 CanvasRenderer
    expected_result: Canvas 图谱正确渲染
    error_handling: 出错时显示 toast 提示，不阻塞其他交互
  - id: B4
    trigger: 步骤4
    action: artifacts 渲染 ArtifactPanel
    expected_result: 内容正确渲染
    error_handling: 出错时显示 toast 提示，不阻塞其他交互
  - id: B5
    trigger: 步骤5
    action: bootstrap 渲染 WorkbenchBootstrapPrototype
    expected_result: 内容正确渲染
    error_handling: 出错时显示 toast 提示，不阻塞其他交互
