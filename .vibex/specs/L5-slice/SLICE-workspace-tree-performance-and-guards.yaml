io_contract:
  input: |
    目录展开与异常请求。
  output: |
    可渐进加载的节点数据 + 明确错误态。
  boundary: |
    不引入复杂索引服务，仅基于当前后端接口增强。
  behavior:
    - "节点上限控制"
    - "错误分类显示"
    - "重试与降级"

