    - id: "SFR-2"
      name: "类型识别"
      rule: "只有 specs/*.yaml|yml 进入 spec 流程，其他文件走普通预览。"
      verification: "同目录不同后缀文件行为正确分流。"
  forbidden:
    - "普通文件误进入 spec 流程"

