<section class="wc-dialog" data-component="dialog-confirm">
  <div class="wc-dialog-body">
    <h4 data-bind="confirm.title">确认执行</h4>
    <p data-bind="confirm.message">将执行写入操作，是否继续？</p>
  </div>
  <footer class="wc-dialog-actions">
    <button type="button" data-action="cancel" data-bind="confirm.cancelLabel">取消</button>
    <button type="button" class="primary" data-action="confirm" data-bind="confirm.confirmLabel">确认</button>
  </footer>
</section>
