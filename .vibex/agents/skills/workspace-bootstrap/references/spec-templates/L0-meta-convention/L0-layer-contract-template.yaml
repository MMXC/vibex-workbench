---
spec:
  version: "1.0"
  level: "0_meta-convention"
  name: "layer-contract"
  parent: null          # L0 无 parent，自身是根
  status: "confirmed"

meta:
  type: "meta-convention"
  owner: "hermes"
  created: "2026-04-23"
  updated: "2026-05-10"
  goskill_ref: "goskill/SPEC.md § Layer Model"

lifecycle:
  current: "confirmed"
  updated: "2026-05-10"

# ── io_contract ─────────────────────────────────
io_contract:
  input: |
    任意项目从 0 开始建立 spec 体系时，需要知道：
    每层 spec 该包含什么字段、如何组织、相互关系是什么。
  output: |
    本文档定义了 L1–L5 每层的 must_contain 字段集、
    可选 mixin 列表，以及层间从属关系的语义约束。
  boundary: |
    本文档只定义规范格式，不定义任何业务逻辑。
    它是元层级约束，不是功能规格。
  behavior: |
    1. 解析 spec 的 level 字段，确定其层级
    2. 按层级验证 must_contain 字段是否齐全
    3. 对 mixin 字段执行合并运算
    4. 对 parent 链路做递归验证

# ── content ─────────────────────────────────────
content:
  summary: |
    定义 L1–L5 每层 spec 的 must_contain 字段集和层间从属关系。
    每层声明其 parent 层，形成纵向从属链。

  # 各层 must_contain 字段
  layer_contracts:
    - level: "1_project-goal"
      description: "工作区总目标收敛；交付物含主界面静态原型（原型槽过关），见 workspace_bootstrap_contract.l1"
      must_contain:
        - spec.level
        - spec.name
        - spec.parent          # L1 固定 null
        - display
        - structure
        - io
        - constraints
        - prototype
        - meta.owner
        - lifecycle
        - io_contract
        - content.mission
        - content.target_users
        - content.constraints
        - content.l1_l2_lineage    # L1 独有两个字段
        - content.product_value_layers
        - changelog
      optional:
        - content.spec_lifecycle
        - content.routing_paths
        - content.goal_spec_visualization
      mixin_targets: ["constraints", "product_value_layers"]

    - level: "2_skeleton"
      description: "L1+主原型 → 可初始化、可打包可运行的工程骨架；多工程多 L2、单入口（见 workspace_bootstrap_contract.l2）"
      must_contain:
        - spec.level
        - spec.name
        - spec.parent          # 必须指向某个 L1 spec.name
        - display
        - structure
        - io
        - constraints
        - prototype
        - meta.module
        - lifecycle
        - io_contract
        - content.modules_matrix
        - content.l2_l3_lineage
        - changelog
      optional:
        - content.tech_stack
        - content.api_design
        - content.data_model
        - content.entry_points
      mixin_targets: ["modules_matrix", "tech_stack"]

    - level: "3_module"
      description: "前端=L2 应用内按主界面拆可见模块区+区原型；后端=分层（适配/领域/…）规范+验证工具；后端可滞后（见 workspace_bootstrap_contract.l3）"
      must_contain:
        - spec.level
        - spec.name
        - spec.parent          # 必须指向某个 L2 spec.name
        - display
        - structure
        - io
        - constraints
        - prototype
        - meta.module
        - lifecycle
        - io_contract
        - content.public_api
        - content.state_definitions
        - content.l3_l4_lineage
        - changelog
      optional:
        - content.internal_structure
        - content.dependencies
        - content.error_handling
      mixin_targets: ["public_api", "state_definitions"]

    - level: "4_feature"
      description: "前端=模块内功能+完整交互原型；后端适配层=与前级前端功能 mixin 的通用插槽代码（见 workspace_bootstrap_contract.l4）"
      must_contain:
        - spec.level
        - spec.name
        - spec.parent          # 必须指向某个 L3 spec.name
        - display
        - structure
        - io
        - constraints
        - prototype
        - meta.module
        - lifecycle
        - io_contract
        - content.behaviors
        - content.test_scenarios
        - content.l4_l5_lineage
        - changelog
      optional:
        - content.user_stories
        - content.ui_flow
        - content.error_messages
        - content.constraints
      mixin_targets: ["behaviors", "test_scenarios"]

    - level: "5_slice"
      description: "L4 的示例实现与红绿测；后端=业务代码嵌入 L4 通用插槽（见 workspace_bootstrap_contract.l5）"
      must_contain:
        - spec.level
        - spec.name
        - spec.parent          # 必须指向某个 L4 spec.name
        - display
        - structure
        - io
        - constraints
        - prototype
        - meta.module
        - lifecycle
        - io_contract
        - content.file_path
        - content.code_template
        - content.generation_rules
        - changelog
      optional:
        - content.unit_tests
        - content.documentation
        - content.dependencies
      mixin_targets: ["code_template", "generation_rules"]

  # 层间从属规则
  parent_chain_rules:
    - rule: "L1.parent == null（顶级项目目标，无上级）"
      enforced: true
    - rule: "L2.parent 必须是一个已确认的 L1 spec.name"
      enforced: true
    - rule: "L3.parent 必须是一个已确认的 L2 spec.name"
      enforced: true
    - rule: "L4.parent 必须是一个已确认的 L3 spec.name"
      enforced: true
    - rule: "L5.parent 必须是一个已确认的 L4 spec.name"
      enforced: true
    - rule: "parent 链路断裂 = 违规，validate_specs.py 返回 exit_code=2"
      enforced: true
    - rule: "同一项目内 spec.name 全局唯一"
      enforced: true

  # mixin 合并语义（同层 mixin，无 diamond）
  mixin_merge_rules:
    - rule: "canonical 槽位：display / structure / io / constraints / prototype 优先于旧字段"
    - rule: "io_contract 字段：基础 + mixin 并集，后者 override 前者"
    - rule: "behaviors 列表：拼接，不去重"
    - rule: "constraints 列表：拼接，不去重"
    - rule: "test_scenarios 列表：拼接，不去重"
    - rule: "meta / lifecycle：取主 spec 值，忽略 mixin 值"
    - rule: "循环 mixin 检测：spec.name 图中有环 → exit_code=2"
    - rule: "同层 mixin 不会产生 diamond（mixin 来自横切维度）"

  # Ln_L(n+1)_lineage 字段语义
  lineage_fields:
    - field: "l1_l2_lineage"
      from: "L1 goal"
      to: "L2 skeleton"
      content: "what_l1_owns / what_l2_owns / traceability"
    - field: "l2_l3_lineage"
      from: "L2 skeleton"
      to: "L3 module"
      content: "which_modules / module_boundaries / cross_module_contracts"
    - field: "l3_l4_lineage"
      from: "L3 module"
      to: "L4 feature"
      content: "which_features / feature_ownership"
    - field: "l4_l5_lineage"
      from: "L4 feature"
      to: "L5 slice"
      content: "which_files / generation_order"

  # 图谱展示用 canonical 槽位
  canonical_slots:
    - field: "display"
      purpose: "为卡片、列表和 agent context 提供中文标题、摘要和描述"
      empty_value: "缺失则显示 待补充"
    - field: "structure"
      purpose: "描述 parent、children、dependencies、impacted_files 等结构关系"
      empty_value: "无结构信息时填空数组或 null"
    - field: "io"
      purpose: "以 input、output、boundary 表达当前 spec 的输入输出和边界"
      empty_value: "缺失则从 io_contract fallback，但新 spec 必须显式填写"
    - field: "constraints"
      purpose: "以 rules、forbidden 表达必须遵守和禁止事项"
      empty_value: "无约束时 rules/forbidden 为空数组"
    - field: "prototype"
      purpose: "引用交互原型或声明无原型，支撑 UI 验收"
      empty_value: "无原型时 status=none、file 为空、validates 为空数组"

  # ── 产品分层治理（规划页 / 模板选型 / L3–L5 边界评审）────────────────
  # 与「收敛·发散」心智（spec-templates/README.md § 层级心智）并列使用。
  product_layering_governance:
    summary: |
      L3 = 应用内可见主模块（壳/分区）；L4 = 从模块上的控件触发的完整能力；L5 = 实现切片。
      prototype 字段可提供预览参照；插槽抽屉从占位走向真实功能时，应对应独立 L4。
    reachability_goal: |
      目标：用户在少量点击（例如三步内）内能从主界面到达任意已声明能力。
      若做不到，检查是否错层、遗漏 L4，或入口未在 L3/L4 中声明。
    l3_module_ui_shell: |
      L3 描述打开应用后用户能看到的**主模块 / 主分区**（如 IDE chrome、资源区、工作台中心、构建区等）。
      偏「壳与模块边界」，不写单次点击后的完整业务闭环。
    l4_feature_click_through: |
      L4 描述从 L3 某分区上的**按钮、文案、链接、菜单项、弹窗入口**所启动的**一条完整用户能力**
      （行为、验收、失败策略）。若同一入口下仍有**多级弹窗、并列子流程或各自独立验收**，应**拆成多条 L4**，
      勿将多条说不清楚的能力挤在一条 L4。
    l5_slice_implementation: |
      L5 描述该 L4 的**实现切片**：文件路径、接口、脚本、生成规则、agent 步骤、红绿测节点等。
    slot_drawer_implementation_note: |
      **Spec 实现插槽 / 抽屉**：仅有容器、尚未绑定具体能力时，允许主要在 L5 写 UI 占位；
      **一旦向抽屉内填充可点的具体功能**（对齐流水线、编排修复、worktree、execute 等），必须新增或补齐对应 **L4**
      描述端到端行为与验收，再由多条 **L5** 承接实现细节；避免仅有 L5 碎片而无 L4 归属。
    split_heuristic:
      - "一条 L4 应用一句话说清验收口径；说不清 → 拆成多条 L4。"
      - "无独占大屏入口、仅由 agent/CLI/后台事件触发的能力，仍挂在语义所属 L3 下写 L4，并在 io/boundary 写明触发方式。"
      - "prototype / governance 预览可提供 UI 参照；实现验证以 L4 behaviors + L5 为准。"

  # ── 新工作区初始化契约（打卡工作区 / 脚手架对齐用）────────────────
  # 与各层模板中 content.workspace_bootstrap_* 占位字段一一对应。
  workspace_bootstrap_contract:
    purpose: |
      定义「从空工作区到可运行工程」时分层交付物与完成条件；与「收敛·发散」及 product_layering_governance 并用。
    l1_goal_and_main_shell_prototype:
      summary: "L1 收敛当前工作区总体目标；可视交付物为**主界面静态原型**。"
      outputs:
        - "叙事：mission / target_users / constraints / product_value_layers（既有）"
        - "主界面静态原型：低保真即可，占位清晰；路径写入 prototype.file，状态非 none"
      prototype_slot_gate: |
        用户在 Workbench **原型槽**打开 L1 时，应看到与主目标一致的主壳界面；通过即表示 L1 对「界面与目标」的口径可被下游消费。
      boundary: |
        L1 不承担高保真迭代与单功能闭环；后者归 L3/L4。避免 L1 与 L3 原型重复堆砌——L1 只锚定**信息架构 + 主路径壳**。
    l2_skeleton_init_and_runnable:
      summary: "输入为 L1 描述 + L1 主原型；推断并落地**可初始化项目**与环境。"
      inputs:
        - "L1 goal spec（正文 + lineage）"
        - "L1 prototype.file 指向的主界面静态资源"
      outputs:
        - "仓库/多仓库目录结构、依赖与入口（content.modules_matrix / entry_points / tech_stack）"
        - "脚手架与初始化脚本可复现"
      completion: |
        本层**完成**判据：工程**可打包、可运行**（本地一条命令起主入口）。多工程（仓库内多端、多包）时：**多个 L2 spec**（同一 L1 parent），并保留**单启动入口设计**（如聚合 Makefile target：`make wails-dev`）。
      multi_l2_rule: |
        每个可独立构建的运行单元可对应一条 L2；在 L1.structure.children 或文档中列出多个 L2 spec.name，并写明单一「日常开发入口」命令。
    l3_modules_frontend_and_backend:
      summary: "L3 挂载在对应 L2 下，按**应用**划分模块。"
      frontend_modules: |
        自 **L1 主界面原型**做**可见区域拆分**（壳上分区/主模块），每个区一条 **MOD-***：交付 **该区交互原型设计**（prototype + public_api/分区组件边界），收敛模块职责与对外契约。
      backend_modules: |
        按应用内分层：**适配层**（HTTP/SSE/WS 等）、**能力层**、**领域层**、**数据层**、**外部接口层** 等；每条 MOD 交付 **该层规范 / 最佳实践**，并列出 **规范验证工具及其使用方式**（脚本、lint、契约测试入口）。
      backend_deferred: |
        后端分层 L3 **不必与前端同步首建**：可在前端 L3 拆出 L4 后，由**后端 L4 反推**补挂对应后端 MOD，再在 lineage 中补 traceability。
      promotion_heuristic: |
        若 L4 设计中**新抽屉/弹窗**将长期被多 feature 共用，考虑**升格为独立 L3 壳上分区**；单次闭环仍归 L4。
    l4_features_and_adapter_mixins:
      summary: "L4 承载可验收的用户或接口能力。"
      frontend: |
        挂在**前端 L3**下：模块内**具体功能**；交付 **该功能的完整交互原型**（含主路径、错误与空态）；`content.behaviors` + `test_scenarios` 对齐验收。
      backend_adapter: |
        **适配层 L4**通常不单独存在：与**对应当前前端功能**的 L4 **通过 mixin 或命名约定配对**，交付 **通用、可替换的插槽式代码**（接口桩、路由表、中间件扩展点）；横切约束可继续用同层 mixin 合并。
    l5_slices_and_red_green:
      summary: "L5 是 L4 的落地切片；实现槽与强校验最重。"
      frontend_backend: |
        每个 L4 至少有一条 L5 **参考实现**或等价物；交付须过 **红/绿或项目约定的强校验**。后端 L5 为 **L4 业务逻辑嵌入 L4 通用插槽**中的**个性化代码**，以便按功能启用/关闭并与单功能测试挂钩。

  # 验证工具
  validation:
    script: "validate_specs.py"
    checks:
      - name: "parent_chain"
        description: "验证 parent 链路完整且无断裂"
        exit_code_on_fail: 2
      - name: "must_contain"
        description: "验证每层 spec 包含必须字段"
        exit_code_on_fail: 2
      - name: "mixin_cycle"
        description: "检测 mixin 引用环"
        exit_code_on_fail: 2
      - name: "io_contract_present"
        description: "验证 io_contract 存在于 frontmatter"
        exit_code_on_fail: 2
      - name: "canonical_slots_present"
        description: "验证 display / structure / io / constraints / prototype 存在于 frontmatter"
        exit_code_on_fail: 2
      - name: "yaml_frontmatter_valid"
        description: "YAML frontmatter 可被 safe_load 解析"
        exit_code_on_fail: 2

changelog:
  - version: "1.0"
    date: "2026-04-23"
    author: "hermes"
    changes:
      - "初始版本：L0-layer-contract"
      - "定义 L1–L5 每层 must_contain 字段集"
      - "定义 parent chain 验证规则"
      - "定义 mixin 合并语义（同层，无 diamond）"
      - "定义 lineage 字段语义"
  - version: "1.1"
    date: "2026-05-10"
    author: "hermes"
    changes:
      - "新增 content.product_layering_governance：产品视角 L3 壳 / L4 点击能力 / L5 实现、可达性、拆分启发式、插槽抽屉从占位到填功能的归属规则"
  - version: "1.2"
    date: "2026-05-10"
    author: "hermes"
    changes:
      - "新增 content.workspace_bootstrap_contract：新工作区 L1–L5 交付物、L1 主壳静态原型与原型槽过关、L2 可运行与多 L2 单入口、L3 前后端分工与后端可滞后、L4 前后+mixin、L5 红绿与后端插槽嵌入"
      - "layer_contracts 各层 description 与上述契约对齐（不改变 must_contain 集合）"
