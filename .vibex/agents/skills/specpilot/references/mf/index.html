<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpecPilot MF Shell</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #7c3aed;
      --bg: #0f0f1a;
      --text: #e0e0f0;
      --card-bg: #1a1a2e;
      --border: #2a2a4a;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Dashboard layout */
    #app {
      flex: 1;
      padding: 28px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      align-content: start;
    }

    /* Component slots — replaced by iframes from parent spec */
    .component-slot {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      min-height: 120px;
      position: relative;
    }
    .slot-label {
      font-size: 10px;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .slot-iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 6px;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
    }

    /* KPICard component */
    .kpi-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
    .kpi-card:hover { border-color: var(--primary); }
    .kpi-label { font-size: 11px; color: #666; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .kpi-value { font-size: 26px; font-weight: 700; color: var(--primary); }

    /* AlertBadge */
    .badge { display: inline-block; padding: 3px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; }
    .badge-pass { background: #05966928; color: #34d399; }
    .badge-fail { background: #dc262628; color: #f87171; }
    .badge-warn { background: #d9770628; color: #fbbf24; }

    /* DataTable */
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); color: #888; font-weight: 600; }
    td { padding: 9px 10px; border-bottom: 1px solid #2a2a4a22; }
    tr:hover td { background: #2a2a4a18; }

    /* StatusBar layout */
    .statusbar {
      height: 36px;
      display: flex;
      align-items: center;
      gap: 0;
      border-top: 1px solid var(--border);
      background: #10131a;
      padding: 0;
      font-size: 11px;
      overflow: hidden;
    }
    .sb-item {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 12px;
      height: 100%;
      border-right: 1px solid #1e2030;
      color: #556;
      white-space: nowrap;
      cursor: default;
    }
    .sb-item:hover { background: rgba(255,255,255,0.04); }
    .sb-dot { width: 6px; height: 6px; border-radius: 50%; }
    .sb-dot.green { background: #4ade80; }
    .sb-dot.red { background: #f87171; }
    .sb-dot.yellow { background: #fbbf24; }

    .no-data { grid-column: 1/-1; text-align: center; color: #555; padding: 40px; font-size: 13px; }
    .route-label { font-size: 10px; color: #334; margin-bottom: 12px; font-family: monospace; }
  </style>
</head>
<body>
  <div id="app">
    <div class="no-data">SpecPilot MF Shell</div>
  </div>

  <script>
    // ── DC Bridge ──────────────────────────────────────────────────────────────
    // Created by the parent preview iframe (which knows SPECPILOT_DC_PORT).
    // Parent injects: window.__specpilotDcBase, window.__specpilotMfBase
    var dcBase = window.__specpilotDcBase || 'http://localhost:5177/api';
    window.__dc = {
      list: async function() {
        var r = await fetch(dcBase + '/dc/list');
        return r.ok ? r.json() : {};
      },
      get: async function(key) {
        var r = await fetch(dcBase + '/dc/' + encodeURIComponent(key));
        return r.ok ? r.json() : null;
      },
      set: async function(key, value) {
        await fetch(dcBase + '/dc/' + encodeURIComponent(key), {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({value: value})
        });
      },
      on: function(event, cb) {
        // EC subscribe via SSE
        var src = new EventSource(dcBase + '/ec/subscribe');
        src.onmessage = function(e) {
          try { var d = JSON.parse(e.data); cb(d); } catch {}
        };
        return function() { src.close(); };
      }
    };

    // ── Router ────────────────────────────────────────────────────────────────
    var route = location.hash.slice(1) || '/';

    function renderApp(route, dc) {
      var app = document.getElementById('app');
      var parts = route.split('?');
      var path = parts[0];
      var params = {};
      if (parts[1]) {
        parts[1].split('&').forEach(function(p) {
          var kv = p.split('=');
          params[kv[0]] = decodeURIComponent(kv[1] || '');
        });
      }

      if (path === '/Dashboard' || path === '/') {
        renderDashboard(app, dc, params);
      } else if (path === '/KPICard') {
        renderKPICard(app, dc, params);
      } else if (path === '/DataTable') {
        renderDataTable(app, dc, params);
      } else if (path === '/AlertBadge') {
        renderAlertBadge(app, dc, params);
      } else if (path === '/StatusBarLayout') {
        renderStatusBarLayout(app, dc, params);
      } else {
        app.innerHTML = '<div class="no-data">Unknown route: ' + route + '</div>';
      }
    }

    function renderDashboard(el, dc, params) {
      el.innerHTML = '<div class="route-label"># /Dashboard</div><div class="no-data">Loading DC data...</div>';
      dc.list().then(function(keys) {
        var html = '<div class="route-label"># /Dashboard</div>';
        Object.keys(keys).forEach(function(k) {
          var v = keys[k];
          if (typeof v === 'object' && v !== null) {
            html += '<div class="kpi-card"><div class="kpi-label">' + k + '</div><div class="kpi-value">' + JSON.stringify(v).slice(0,40) + '</div></div>';
          } else {
            html += '<div class="kpi-card"><div class="kpi-label">' + k + '</div><div class="kpi-value">' + v + '</div></div>';
          }
        });
        el.innerHTML = html;
      }).catch(function() {
        el.innerHTML = '<div class="no-data">DC unavailable — start with specpilot start</div>';
      });
    }

    function renderKPICard(el, dc, params) {
      var key = params.key || 'kpi.revenue';
      el.innerHTML = '<div class="route-label"># /KPICard?key=' + key + '</div><div class="kpi-card"><div class="kpi-label">' + key + '</div><div class="kpi-value" id="kpi-val">...</div></div>';
      dc.get(key).then(function(d) {
        var val = d && d.value !== undefined ? d.value : d;
        document.getElementById('kpi-val').textContent = val;
      }).catch(function() {
        document.getElementById('kpi-val').textContent = '—';
      });
      // Subscribe to changes
      var unsub = dc.on(function(ev) {
        if (ev.key === key) {
          var val = ev.value !== undefined ? ev.value : ev.data;
          document.getElementById('kpi-val').textContent = val;
        }
      });
    }

    function renderDataTable(el, dc, params) {
      var key = params.key || 'table.users';
      el.innerHTML = '<div class="route-label"># /DataTable?key=' + key + '</div><div id="tbl-wrap">Loading...</div>';
      dc.get(key).then(function(d) {
        var val = d && d.value !== undefined ? d.value : d;
        var cols = Array.isArray(val.columns) ? val.columns : ['Key', 'Value'];
        var rows = Array.isArray(val.rows) ? val.rows : [[key, JSON.stringify(val)]];
        var header = '<thead><tr>' + cols.map(function(c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead>';
        var body = '<tbody>' + rows.map(function(row) {
          return '<tr>' + (Array.isArray(row) ? row : [key, row]).map(function(cell) { return '<td>' + cell + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody>';
        document.getElementById('tbl-wrap').innerHTML = '<table>' + header + body + '</table>';
      });
    }

    function renderAlertBadge(el, dc, params) {
      var status = params.status || 'pass';
      var label = params.label || status.toUpperCase();
      var cls = status === 'pass' ? 'badge-pass' : status === 'fail' ? 'badge-fail' : 'badge-warn';
      el.innerHTML = '<div class="route-label"># /AlertBadge?status=' + status + '</div><div><span class="badge ' + cls + '">' + label + '</span></div>';
    }

    function renderStatusBarLayout(el, dc, params) {
      var key = params.key || 'statusbar.layout';
      el.innerHTML = '<div class="route-label"># /StatusBarLayout?key=' + key + '</div><div class="statusbar" id="sb-items"><div class="no-data">Loading...</div></div>';
      dc.get(key).then(function(d) {
        var val = d && d.value !== undefined ? d.value : d;
        var items = Array.isArray(val.items) ? val.items : [];
        var html = items.map(function(item) {
          return '<div class="sb-item"><span class="sb-dot" style="background:' + (item.color || '#888') + '"></span>' + item.label + '</div>';
        }).join('');
        document.getElementById('sb-items').innerHTML = html || '<div class="sb-item">No items</div>';
      });
    }

    // Start
    if (window.__dc) {
      renderApp(route, window.__dc);
      // Watch for hash changes (SPA routing)
      window.addEventListener('hashchange', function() {
        renderApp(location.hash.slice(1) || '/', window.__dc);
      });
    } else {
      document.getElementById('app').innerHTML = '<div class="no-data">DC bridge not ready — ensure parent iframe sets window.__specpilotDcBase</div>';
    }
  </script>
</body>
</html>
