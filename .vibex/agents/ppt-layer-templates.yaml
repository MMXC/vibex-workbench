version: "1"
style:
  name: "spec-explainer-unified"
  audience:
    - "CTO：关注业务价值、架构风险、资源与里程碑。"
    - "开发：关注模块边界、实现方案、改动面、技术债。"
    - "测试：关注可测性、验证路径、覆盖盲区、回归风险。"
    - "用户/业务：关注体验收益、流程变化、可见价值。"
  theme_candidates:
    - "blueprint"
    - "tokyo-night"
    - "corporate-clean"
  theme_by_level:
    L1: "corporate-clean"
    L2: "swiss-grid"
    L3: "tokyo-night"
    L4: "blueprint"
    L5: "engineering-whiteprint"
    UNK: "blueprint"
  rules:
    - "统一 header/footer/页码/键盘导航，保持演示观感一致。"
    - "每页 1 个主标题 + 3~5 条要点，禁止长段落堆砌。"
    - "每套 deck 必须同时覆盖 as-is（现状）与 to-be（目标）并标记差距。"
    - "现状必须来自真实工作区可验证证据（spec key、代码路径、接口、原型文件），禁止臆测。"
    - "若 spec 关联 spec.ppt_file（演示 HTML）与 prototype.file 且文件存在，必须单独一页展示原型现状与可用性结论。"
    - "L4/L5 且工作区存在可打开的原型或 .vibex 生成页时：须各有一页「状态矩阵」（含适用时的 loading/empty/error）、一页「边界演示」（从 constraints.rules 选取并写明触发方式）；无原型时用表格列出计划状态并标注待生成。"
    - "结尾必须给出可调整的 spec 描述建议与潜在风险，优先高收益与高风险项。"
    - "必须显式覆盖四类视角：CTO、开发、测试、用户；至少各有 1 页或 1 个清晰分区。"
    - "必须有“决策页”：给出推荐方案、备选方案、取舍理由、成本与风险。"
    - "必须有“执行页”：里程碑、负责人、验收标准、回滚策略。"
    - "讲解深度要求：不仅描述是什么，还要讲为什么、怎么做、如何验证、失败怎么办。"

layers:
  L1:
    - "封面 -> 总目标与成功指标 -> 竞品分析 -> 关键决策点 -> 最小MVP -> 路线图 -> 当前现状（真实工作区证据）。"
    - "聚焦“为什么做/做到什么算成功”，并明确对 L2/L3 的约束和验收口径。"
    - "必须讲透：战略价值、组织投入、跨团队依赖、阶段性收益与止损点。"
    - "风格偏产品展示 现状 愿景"
  L2:
    - "封面 -> 项目骨架图 -> 系统设计图 -> 关键点 -> 当前现状分析 -> 优化方向。"
    - "聚焦“把目标拆成可交付架构”，明确模块边界、接口关系和薄弱点。"
    - "必须讲透：架构分层、关键链路、非功能性要求（性能/可靠性/安全）与测试策略。"
    - "风格偏技术架构展示 现状 优化方向 knowledge-arch-blueprint主题偏好"
  L3:
    - "封面 -> 当前模块分析 -> 已实现功能（真实关联） -> 缺失功能 -> 实现现状证据 -> 功能缺失影响与优先级。"
    - "聚焦“模块能力完整性”，强调已实现/未实现边界与后续补齐策略。"
    - "必须讲透：模块职责、接口契约、异常处理、可观测性与可测试性。"
    - "风格偏模块展示 现状 优化方向 graphify-dark-graph主题偏好"
  L4:
    - "封面 -> 功能目标 -> 现状真实展示（含原型嵌入或深链一页，路径须与工作区文件一致）-> 状态矩阵页 -> 边界演示页 -> 优化分析 -> spec 与实际实现偏差 -> 风险与验证。"
    - "聚焦“功能级落地差距”，强调偏差来源与可执行修订建议。"
    - "必须讲透：用户路径变化、前后端联动、验收条件、灰度与回滚。"
    - "风格偏功能展示 现状 优化方向 graphify-dark-graph主题偏好"
  L5:
    - "封面 -> 实现目标与完成标准 -> 现状真实实现展示（含原型嵌入或深链）-> 状态矩阵页 -> 边界演示页（constraints / 验收口径）-> 优化分析 -> spec 与实现偏差 -> 验证步骤与排错线索。"
    - "聚焦“实现级实用性”，给出最小可执行修订与优先级排序。"
    - "必须讲透：代码改动点、调用链、测试用例、故障注入与定位手册。"
    - "风格偏实现展示 现状 优化方向 graphify-dark-graph主题偏好"
  UNK:
    - "封面 -> 背景 -> 现状证据 -> 差距与优化 -> 风险 -> 总结。"