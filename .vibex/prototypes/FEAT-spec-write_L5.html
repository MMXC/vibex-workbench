<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenericSpecGraph - 泳道模式 (L5)</title>
<style>
  /* === 重置 === */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0b0c10;
    color: #eef0f5;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 16px;
  }

  /* === Generic Graph Container (直接复制源码) === */
  .generic-graph {
    height: 100%;
    min-height: 280px;
    display: flex;
    flex-direction: column;
    padding: 12px;
    background:
      linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      #0e1016;
    background-size: 26px 26px;
    color: #eef0f5;
  }

  /* === Graph Header === */
  .graph-head {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 12px;
    padding: 13px 15px;
    border: 1px solid #303746;
    border-radius: 16px;
    background: rgba(28, 32, 42, 0.78);
  }

  .graph-head > div { flex: 1; }

  .graph-head h2 {
    margin: 0 0 5px;
    font-size: 15px;
    font-weight: 840;
    letter-spacing: -0.02em;
  }

  .graph-head p {
    margin: 0;
    color: #a3abb9;
    font-size: 12px;
    line-height: 1.45;
  }

  .eyebrow {
    display: block;
    margin-bottom: 6px;
    color: #72d6d0;
    font-family: 'Cascadia Code', ui-monospace, monospace;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .mode-badge {
    flex-shrink: 0;
    border: 1px solid #465064;
    border-radius: 999px;
    padding: 5px 10px;
    color: #7aa2ff;
    font-family: 'Cascadia Code', ui-monospace, monospace;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
  }

  /* === Radial Canvas === */
  .radial {
    position: relative;
    flex: 1;
    min-height: 420px;
    border: 1px solid #303746;
    border-radius: 16px;
    background: rgba(12, 14, 19, 0.74);
    overflow: hidden;
  }

  /* === Lane Dividers (泳道线) === */
  .lane {
    position: absolute;
    top: 18px;
    bottom: 18px;
    width: 1px;
    border-left: 1px solid #242b38;
    display: block;
  }

  .lane span {
    position: absolute;
    top: -2px;
    left: 6px;
    color: #6f7888;
    font-family: 'Cascadia Code', ui-monospace, monospace;
    font-size: 10px;
    font-weight: 800;
    pointer-events: none;
  }

  /* === Edge Lines (关系线) === */
  .edge {
    position: absolute;
    height: 1.5px;
    background: #465064;
    transform: translateY(-50%);
    pointer-events: none;
  }

  .edge::after {
    content: '';
    position: absolute;
    right: -1px;
    top: 50%;
    width: 0;
    height: 0;
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    border-left: 7px solid #465064;
    transform: translateY(-50%);
  }

  .parent-edge { top: 50%; }
  .child-edge {
    top: 84%;
    border-top: 1px dashed #465064;
    background: transparent;
  }

  /* === 共享卡片基础样式 (orbit-card) === */
  .orbit-card, .relation-card, .add-card {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 142px;
    padding: 0.48rem 0.62rem;
    font-size: 10px;
    line-height: 1.2;
    border-radius: 12px;
    border: 1px solid #465064;
    background: #171b24;
    color: #d4d4d8;
    text-align: left;
    pointer-events: none;
  }

  /* === Slot Card (槽位卡片) === */
  .slot-card {
    display: grid;
    gap: 3px;
    pointer-events: auto;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 140ms ease, background 140ms ease, transform 140ms ease;
  }

  .slot-card:hover {
    border-color: rgba(122, 162, 255, 0.76);
    background: rgba(122, 162, 255, 0.13);
    transform: translate(-50%, -50%) translateY(-1px);
  }

  .slot-card.present { border-color: rgba(114, 214, 208, 0.58); background: rgba(114, 214, 208, 0.08); }
  .slot-card.empty, .slot-card.na { border-color: rgba(111, 120, 136, 0.46); opacity: 0.78; }
  .slot-card.missing { border-color: rgba(239, 198, 107, 0.58); background: rgba(239, 198, 107, 0.08); }

  /* === Relation Card === */
  .relation-card .k {
    display: block;
    color: #6f7888;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 3px;
  }

  .relation-card strong {
    display: block;
    font-size: 11px;
    color: #eef0f5;
    margin-bottom: 3px;
  }

  /* === Add Card === */
  .add-card {
    border: 1px dashed #465064;
    background: rgba(28, 32, 42, 0.6);
    text-align: center;
    cursor: pointer;
  }

  .add-card:hover { border-color: #7aa2ff; color: #7aa2ff; }

  .add-card .k {
    display: block;
    color: #6f7888;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 2px;
  }

  .add-card strong { font-size: 11px; color: #a3abb9; }

  /* === Center Card (当前 Spec 卡片) === */
  .center-card {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(88%, 360px);
    padding: 1rem;
    border-radius: 16px;
    border: 2px solid #7aa2ff;
    background: linear-gradient(145deg, rgba(31, 36, 49, 0.96), rgba(15, 17, 23, 0.98));
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.42);
    cursor: pointer;
    outline: none;
    transition: transform 160ms ease, border-color 160ms ease;
  }

  .center-card:hover, .center-card:focus {
    transform: translate(-50%, -50%) translateY(-2px);
    border-color: #72d6d0;
  }

  .kicker {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #72d6d0;
    margin-bottom: 0.35rem;
  }

  .center-card .title { margin: 0 0 0.35rem; font-size: 1.1rem; font-weight: 840; color: #eef0f5; }
  .center-card .meta { margin: 0; font-size: 11px; color: #7aa2ff; font-family: 'Cascadia Code', ui-monospace, monospace; }
  .center-card .summary { margin: 0 0 0.45rem; font-size: 12px; line-height: 1.45; color: #c4c4cc; }
  .center-card .path { margin: 0.5rem 0 0; font-size: 10px; font-family: ui-monospace, monospace; color: #71717a; word-break: break-all; line-height: 1.35; }

  .attach {
    margin-top: 0.75rem;
    width: 100%;
    border: 1px solid #72d6d0;
    border-radius: 10px;
    background: rgba(114, 214, 208, 0.12);
    color: #e6fffb;
    font-size: 12px;
    padding: 0.45rem 0.55rem;
    cursor: pointer;
    transition: background 140ms ease;
  }

  .attach:hover { background: rgba(114, 214, 208, 0.2); border-color: #72d6d0; }

  /* === Slot Card 内部结构 === */
  .slot-card .k { color: #6f7888; font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; }
  .slot-card strong { font-size: 12px; color: #eef0f5; }
  .slot-card small { color: #a3abb9; font-size: 9px; }
  .slot-card em { color: #7aa2ff; font-style: normal; font-size: 9px; }

  /* === Graph Footer === */
  .graph-foot {
    flex-shrink: 0;
    display: flex;
    gap: 16px;
    margin-top: 10px;
    padding: 10px 14px;
    border: 1px solid #303746;
    border-radius: 12px;
    background: rgba(28, 32, 42, 0.6);
  }

  .graph-foot div { display: flex; align-items: baseline; gap: 5px; }
  .graph-foot strong { font-size: 14px; color: #7aa2ff; }
  .graph-foot span { font-size: 11px; color: #6f7888; }

  /* === 控制面板 === */
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 12px;
    background: #151820;
    border: 1px solid #303746;
    border-radius: 8px;
    max-width: 900px;
    margin: 0 auto;
  }

  .controls label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #a3abb9; cursor: pointer; }
  .controls select { background: #1c202a; border: 1px solid #303746; color: #eef0f5; padding: 4px 8px; border-radius: 4px; font-size: 12px; }

  /* === Toast === */
  .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    padding: 12px 18px;
    border-radius: 8px;
    background: #1c202a;
    border: 1px solid #303746;
    color: #eef0f5;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
</style>
</head>
<body>

<!-- 控制面板 -->
<div class="controls">
  <label>
    Spec 层级:
    <select id="levelSelect" onchange="renderGraph()">
      <option value="L1">L1 (root)</option>
      <option value="L2">L2</option>
      <option value="L3">L3</option>
      <option value="L4">L4</option>
      <option value="L5" selected>L5 (当前)</option>
    </select>
  </label>
</div>

<!-- ==================== GENERIC SPEC GRAPH ==================== -->
<div class="generic-graph" id="graphContainer">
  <!-- Graph Header -->
  <div class="graph-head">
    <div>
      <span class="eyebrow">Layered DAG Canvas</span>
      <h2 id="specTitle">FEAT-spec-write_L5</h2>
      <p id="specSummary">成功: { success: true, path: "..." }</p>
    </div>
    <span class="mode-badge" id="levelBadge">L5</span>
  </div>

  <!-- Radial Canvas -->
  <div class="radial" id="radial"></div>

  <!-- Graph Footer -->
  <div class="graph-foot">
    <div><strong id="readyCount">3</strong><span>ready slots</span></div>
    <div><strong id="statusVal">proposal</strong><span>status</span></div>
    <div><strong id="parentVal">FEAT-spec-write</strong><span>parent</span></div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script>
  const LANES = ['L1', 'L2', 'L3', 'L4', 'L5'];

  function laneLeft(lane) {
    const idx = Math.max(LANES.indexOf(lane), 2);
    return 8 + idx * 21;
  }

  const SLOT_DATA = [
    { id: 'io_contract', label: 'io_contract', status: 'present', count: 2, summary: 'I/O 契约' },
    { id: 'prototype', label: 'prototype', status: 'present', count: 0, summary: '原型槽位' },
    { id: 'content', label: 'content', status: 'present', count: 0, summary: '实现内容' },
    { id: 'constraints', label: 'constraints', status: 'missing', count: 0, summary: '约束条件' },
    { id: 'dependencies', label: 'dependencies', status: 'empty', count: 0, summary: '依赖关系' },
    { id: 'metrics', label: 'metrics', status: 'na', count: 0, summary: '可观测性' },
  ];

  const SPEC_DATA = {
    L1: { title: 'vibex-workbench-mvp', summary: '一个完整可运行的项目', status: 'proposal', parent: null },
    L2: { title: 'vibex-workbench-skeleton', summary: '技术骨架 spec', status: 'proposal', parent: 'vibex-workbench-mvp' },
    L3: { title: 'MOD-spec-editor', summary: 'spec 内容渲染', status: 'proposal', parent: 'vibex-workbench-skeleton' },
    L4: { title: 'FEAT-spec-write', summary: 'SpecViewer 编辑功能', status: 'proposal', parent: 'MOD-spec-editor' },
    L5: { title: 'FEAT-spec-write_L5', summary: '成功: { success: true, path: "..." }', status: 'proposal', parent: 'FEAT-spec-write' },
  };

  function slotValue(slot) {
    if (slot.status === 'present') return slot.count > 0 ? `${slot.count}` : '✓';
    if (slot.status === 'empty') return '无';
    if (slot.status === 'na') return '不适用';
    return '待补充';
  }

  function slotActionLabel(slot) {
    if (slot.status === 'missing' || slot.status === 'empty') return '澄清补全';
    if (slot.id === 'input' || slot.id === 'output') return '校验 I/O';
    if (slot.id === 'implementation') return '实现路由';
    if (slot.id === 'prototype') return '澄清原型';
    return '分析';
  }

  function renderGraph() {
    const level = document.getElementById('levelSelect').value;
    const spec = SPEC_DATA[level];
    const currentLeft = laneLeft(level);
    const parentLeft = Math.max(8, currentLeft - 21);
    const childLeft = Math.min(92, currentLeft + 21);

    document.getElementById('specTitle').textContent = spec.title;
    document.getElementById('specSummary').textContent = spec.summary;
    document.getElementById('levelBadge').textContent = level;
    document.getElementById('statusVal').textContent = spec.status;
    document.getElementById('parentVal').textContent = spec.parent || 'root';
    document.getElementById('readyCount').textContent = SLOT_DATA.filter(s => s.status === 'present').length;

    const radial = document.getElementById('radial');
    radial.innerHTML = '';

    // 泳道线
    LANES.forEach((lane, i) => {
      const laneEl = document.createElement('span');
      laneEl.className = 'lane';
      laneEl.style.left = `${8 + i * 21}%`;
      laneEl.innerHTML = `<span>${lane}</span>`;
      radial.appendChild(laneEl);
    });

    // Parent Edge + Card
    if (spec.parent) {
      const parentEdge = document.createElement('span');
      parentEdge.className = 'edge parent-edge';
      parentEdge.style.left = `${parentLeft + 9}%`;
      parentEdge.style.width = `${currentLeft - parentLeft - 13}%`;
      radial.appendChild(parentEdge);

      const parentCard = document.createElement('div');
      parentCard.className = 'relation-card';
      parentCard.style.left = `${parentLeft}%`;
      parentCard.style.top = '50%';
      parentCard.innerHTML = `<span class="k">parent</span><strong>${spec.parent}</strong>`;
      radial.appendChild(parentCard);
    }

    // Slot Cards
    SLOT_DATA.forEach((slot, i) => {
      const slotCard = document.createElement('button');
      slotCard.type = 'button';
      slotCard.className = `orbit-card slot-card ${slot.status}`;
      slotCard.style.left = `${childLeft}%`;
      slotCard.style.top = `${15 + i * 12}%`;
      slotCard.title = `${slot.summary} · 点击进入${slotActionLabel(slot)}`;
      slotCard.innerHTML = `
        <span class="k">${slot.label}</span>
        <strong>${slotValue(slot)}</strong>
        <small>${slot.summary}</small>
        <em>${slotActionLabel(slot)}</em>
      `;
      slotCard.onclick = () => showToast(`Slot: ${slot.label} — 打开澄清面板`);
      radial.appendChild(slotCard);
    });

    // Child Edge + Add Card
    if (level !== 'L5') {
      const childEdge = document.createElement('span');
      childEdge.className = 'edge child-edge';
      childEdge.style.left = `${currentLeft + 9}%`;
      childEdge.style.width = `${childLeft - currentLeft - 13}%`;
      radial.appendChild(childEdge);

      const addCard = document.createElement('div');
      addCard.className = 'add-card';
      addCard.style.left = `${childLeft}%`;
      addCard.style.top = '84%';
      addCard.innerHTML = `<span class="k">Add child</span><strong>next spec</strong>`;
      addCard.onclick = () => showToast('Add child: 创建下一级 Spec');
      radial.appendChild(addCard);
    }

    // Center Card
    const centerCard = document.createElement('div');
    centerCard.className = 'center-card';
    centerCard.style.left = `${currentLeft}%`;
    centerCard.style.top = '50%';
    centerCard.innerHTML = `
      <span class="kicker">Spec 文件</span>
      <h2 class="title">${spec.title}</h2>
      <p class="summary">${spec.summary}</p>
      <p class="meta">level: 5_implementation</p>
      <p class="path">specs/L${LANES.indexOf(level) + 1}-slice/${spec.title}.yaml</p>
      <button type="button" class="attach" onclick="event.stopPropagation(); showToast('已添加到 Agent Context')">Add to Context</button>
    `;
    centerCard.onclick = () => showToast('Spec 卡片: 点击添加到右侧 Context');
    radial.appendChild(centerCard);
  }

  function showToast(message) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = `✅ ${message}`;
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.animation = 'slideIn 0.3s ease reverse';
      setTimeout(() => toast.remove(), 300);
    }, 2500);
  }

  renderGraph();
</script>
</body>
</html>
