version: "1"
style:
  name: "spec-explainer-unified"
  theme_candidates:
    - "blueprint"
    - "tokyo-night"
    - "corporate-clean"
  theme_by_level:
    L1: "corporate-clean"
    L2: "swiss-grid"
    L3: "tokyo-night"
    L4: "blueprint"
    L5: "engineering-whiteprint"
    UNK: "blueprint"
  rules:
    - "统一 header/footer/页码/键盘导航，保持演示观感一致。"
    - "每页 1 个主标题 + 3~5 条要点，禁止长段落堆砌。"
    - "每套 deck 必须同时覆盖 as-is（现状）与 to-be（目标）并标记差距。"
    - "结尾必须给出可调整的 spec 描述建议与潜在风险。"

layers:
  L1:
    - "封面 -> 业务目标与成功指标 -> 范围边界(in/out) -> 顶层能力地图 -> 主要风险与假设 -> 决策与下一步。"
    - "聚焦“为什么做/做到什么算成功”，弱化实现细节，强调对下层 spec 的约束与验收口径。"
  L2:
    - "封面 -> 能力分解树 -> 用户旅程/主流程 -> 模块职责分配 -> 依赖与接口边界 -> 风险与调整建议。"
    - "聚焦“把目标拆成可交付能力”，明确每块能力的 owner、输入输出与完成定义。"
  L3:
    - "封面 -> 模块定位 -> 对外接口与契约 -> 关键数据流与状态 -> 异常路径与恢复策略 -> 验证计划。"
    - "聚焦“模块怎么协作”，强调接口稳定性、状态机和故障处理。"
  L4:
    - "封面 -> 特性价值与触发场景 -> as-is vs to-be 差异 -> 关键交互/流程图 -> 受影响文件与改动面 -> 风险与回滚。"
    - "聚焦“这个 feature 如何落地”，强调跨模块影响、改动边界、验证入口。"
  L5:
    - "封面 -> 实现目标与完成标准 -> 输入/输出/boundary 细化 -> 代码改动点与调用链 -> 测试验证与观测信号 -> 已知问题与调参建议。"
    - "聚焦“具体实现怎么做”，必须给出可执行验证步骤与排错线索，方便 agent/用户快速修订描述。"
  UNK:
    - "封面 -> 背景 -> IO契约 -> 结构位置 -> 实现与风险 -> 总结。"
