<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeX 原型提取器</title>
  <style>
    :root {
      --bg: #0f0e17;
      --surface: #1a1830;
      --border: #2d2b55;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --text: #fffffe;
      --text-muted: #94a1b2;
      --green: #10b981;
      --yellow: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }
    .badge {
      background: var(--accent);
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .btn {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .status-dot.idle { background: var(--text-muted); }
    .status-dot.active { background: var(--green); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 4px 0;
      color: var(--text-muted);
    }
    .info-row span:last-child { color: var(--text); }
    .hint {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .extracted-preview {
      background: var(--bg);
      border-radius: 6px;
      padding: 10px;
      max-height: 200px;
      overflow: auto;
      font-size: 11px;
      font-family: monospace;
      color: var(--text-muted);
      white-space: pre-wrap;
      word-break: break-all;
    }
    .export-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>VibeX 原型提取器</h1>
    <span class="badge">v0.1</span>
  </div>

  <!-- 状态区 -->
  <div class="section">
    <div class="section-title">当前状态</div>
    <div class="status">
      <div class="status-dot idle" id="statusDot"></div>
      <span id="statusText">等待操作</span>
    </div>
  </div>

  <!-- 提取控制 -->
  <div class="section">
    <div class="section-title">选区提取</div>
    <button class="btn btn-primary" id="btnExtract">选择网页区域</button>
    <p class="hint" style="margin-top:8px">
      点击后在网页上点击任意元素即可提取。ESC 取消。
    </p>
  </div>

  <!-- 提取预览 -->
  <div class="section" id="previewSection" style="display:none">
    <div class="section-title">提取预览</div>
    <div class="info-row">
      <span>元素标签</span>
      <span id="elTag">-</span>
    </div>
    <div class="info-row">
      <span>来源页面</span>
      <span id="elSource">-</span>
    </div>
    <div class="extracted-preview" id="extractedHTML"></div>
    <div class="export-actions">
      <button class="btn btn-secondary" id="btnCopyHTML">复制 HTML</button>
      <button class="btn btn-secondary" id="btnExport">导出到 Workbench</button>
    </div>
  </div>

  <!-- 说明 -->
  <div class="section">
    <div class="section-title">工作流程</div>
    <p class="hint">
      ① 在 workbench 原型抽屉点击「浏览器完善区域」<br>
      ② 在本插件中选中满意的网页区域<br>
      ③ 复制 HTML 或导出到 workbench<br>
      ④ agent 基于原型用 grill-me 澄清 → 生成 spec
    </p>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
