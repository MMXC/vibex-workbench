<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #0f0e17;
      --surface: #1a1830;
      --border: #2d2b55;
      --accent: #6366f1;
      --accent-dim: rgba(99,102,241,0.15);
      --text: #fffffe;
      --muted: #94a1b2;
      --green: #22c55e;
      --yellow: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .sp-root { display: flex; flex-direction: column; height: 100vh; }

    /* Header */
    .sp-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .sp-head-left { display: flex; align-items: center; gap: 8px; }
    .sp-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .sp-badge { font-size: 9px; background: var(--accent); color: white; padding: 2px 5px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .sp-status { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: #1a1a2e; color: var(--muted); border: 1px solid var(--border); }
    .sp-status[data-status="extracting"] { color: var(--yellow); border-color: var(--yellow); background: rgba(245,158,11,0.1); }
    .sp-status[data-status="pending_confirmation"] { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }
    .sp-status[data-status="confirmed"] { color: var(--green); border-color: var(--green); background: rgba(34,197,94,0.1); }

    /* Hint */
    .sp-hint { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--accent-dim); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text); flex-shrink: 0; }
    .sp-hint-icon { font-size: 20px; }
    .sp-hint small { color: var(--muted); font-size: 11px; }

    /* Conversation */
    .sp-conv { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
    .sp-empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .sp-empty p { margin-bottom: 16px; }
    .sp-round { display: flex; gap: 8px; }
    .sp-rnum { font-size: 10px; font-weight: 700; color: var(--muted); width: 22px; flex-shrink: 0; padding-top: 2px; }
    .sp-rcard { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .sp-rmsg { display: flex; flex-direction: column; gap: 3px; }
    .sp-rmsg-agent { align-items: flex-start; }
    .sp-rmsg-user { align-items: flex-end; }
    .sp-role { font-size: 9px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 600; }
    .sp-text { font-size: 13px; line-height: 1.5; padding: 8px 12px; border-radius: 10px; max-width: 90%; word-break: break-word; }
    .sp-rmsg-agent .sp-text { background: #1e1b4b; color: #e2e8f0; border-bottom-left-radius: 3px; }
    .sp-rmsg-user .sp-text { background: #1e3a5f; color: #e2e8f0; border-bottom-right-radius: 3px; }

    /* Answer area */
    .sp-answer-area { border-top: 1px solid var(--border); padding: 12px 16px; flex-shrink: 0; background: var(--surface); }
    .sp-question-preview { margin-bottom: 8px; }
    .sp-q-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent); font-weight: 700; }
    .sp-question-preview p { font-size: 12px; color: var(--text); margin-top: 3px; }
    .sp-textarea { width: 100%; background: #0f0e17; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; padding: 8px 10px; resize: none; font-family: inherit; line-height: 1.5; }
    .sp-textarea:focus { outline: none; border-color: var(--accent); }
    .sp-answer-actions { display: flex; gap: 8px; margin-top: 8px; }

    /* Buttons */
    .sp-btn-primary { flex: 1; padding: 8px 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
    .sp-btn-primary:hover { background: #818cf8; }
    .sp-btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .sp-btn-secondary { flex: 1; padding: 8px 12px; background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; font-size: 12px; cursor: pointer; transition: all 0.15s; }
    .sp-btn-secondary:hover { border-color: var(--accent); color: var(--text); }
    .sp-btn-ghost { padding: 8px 12px; background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; font-size: 12px; cursor: pointer; }
    .sp-btn-ghost:hover { color: var(--text); }

    /* Export */
    .sp-export { border-top: 1px solid var(--border); padding: 12px 16px; flex-shrink: 0; background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
    .sp-export-section { }
    .sp-export-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
    .sp-export-preview { font-size: 11px; font-family: monospace; color: var(--muted); background: var(--bg); padding: 6px 8px; border-radius: 6px; margin-bottom: 6px; word-break: break-all; }
    .sp-yaml { font-size: 10px; font-family: monospace; color: var(--muted); background: var(--bg); padding: 8px; border-radius: 6px; max-height: 160px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
    .sp-export-actions { margin-top: 4px; }
  </style>
  <script type="module" crossorigin src="/chunks/sidepanel-DPbbfBKe.js"></script>
</head>
<body>
  <div id="app" class="sp-root">
    <div class="sp-head">
      <div class="sp-head-left">
        <span class="sp-title">VibeX 原型提取器</span>
        <span class="sp-badge">grill-me</span>
      </div>
      <span class="sp-status" id="statusBadge">空闲</span>
    </div>
    <div class="sp-conv" id="convArea">
      <div class="sp-empty">
        <p>点击「开始选区」后，选中满意的网页区块<br>agent 会基于选区逐轮澄清设计意图</p>
        <button class="sp-btn-primary" id="btnStart">开始选区</button>
      </div>
    </div>
    <div id="answerArea" style="display:none"></div>
    <div id="exportArea" style="display:none"></div>
  </div>

  <script>
    let session = null;
    let sending = false;

    const statusBadge = document.getElementById('statusBadge');
    const convArea = document.getElementById('convArea');
    const answerArea = document.getElementById('answerArea');
    const exportArea = document.getElementById('exportArea');

    function statusLabel(s) {
      return { idle: '空闲', extracting: '选区中', pending_confirmation: '澄清中', confirmed: '已完成' }[s] || s;
    }

    function render() {
      const status = session?.status || 'idle';
      const rounds = session?.rounds || [];
      const pending = rounds[rounds.length - 1];
      const isPending = pending && !pending.confirmed;

      statusBadge.textContent = statusLabel(status);
      statusBadge.dataset.status = status;

      if (status === 'idle' && rounds.length === 0) {
        convArea.innerHTML = `<div class="sp-empty"><p>点击「开始选区」后，选中满意的网页区块<br>agent 会基于选区逐轮澄清设计意图</p><button class="sp-btn-primary" id="btnStart">开始选区</button></div>`;
        document.getElementById('btnStart')?.addEventListener('click', startSelection);
        answerArea.style.display = 'none';
        exportArea.style.display = 'none';
        return;
      }

      if (status === 'extracting') {
        convArea.innerHTML = `<div class="sp-hint"><span class="sp-hint-icon">🎯</span><span>在页面上点击任意元素开始提取<br><small>ESC 取消</small></span></div>`;
        answerArea.style.display = 'none';
        exportArea.style.display = 'none';
        return;
      }

      // Render rounds
      convArea.innerHTML = rounds.map(r => `
        <div class="sp-round">
          <div class="sp-rnum">R${r.round}</div>
          <div class="sp-rcard">
            <div class="sp-rmsg sp-rmsg-agent">
              <span class="sp-role">agent</span>
              <p class="sp-text">${esc(r.question)}</p>
            </div>
            ${r.answer ? `
            <div class="sp-rmsg sp-rmsg-user">
              <span class="sp-role">you</span>
              <p class="sp-text">${esc(r.answer)}</p>
            </div>` : ''}
          </div>
        </div>
      `).join('');

      // Answer area
      if (isPending) {
        answerArea.style.display = 'block';
        answerArea.innerHTML = `
          <div class="sp-answer-area">
            <div class="sp-question-preview">
              <span class="sp-q-label">Q${pending.round}</span>
              <p>${esc(pending.question)}</p>
            </div>
            <textarea class="sp-textarea" id="answerInput" rows="3" placeholder="你的回答…" spellcheck="false"></textarea>
            <div class="sp-answer-actions">
              <button class="sp-btn-primary" id="btnAnswer" ${sending ? 'disabled' : ''}>${sending ? '分析中…' : '确认回答'}</button>
              <button class="sp-btn-ghost" id="btnSkip">跳过</button>
            </div>
          </div>`;
        document.getElementById('btnAnswer')?.addEventListener('click', submitAnswer);
        document.getElementById('btnSkip')?.addEventListener('click', () => {
          const inp = document.getElementById('answerInput');
          if (inp) { inp.value = '(跳过)'; submitAnswer(); }
        });
        exportArea.style.display = 'none';
      } else if (status === 'confirmed') {
        answerArea.style.display = 'none';
        renderExport();
      } else {
        answerArea.style.display = 'none';
        exportArea.style.display = 'none';
      }
    }

    async function renderExport() {
      exportArea.style.display = 'block';
      const resp = await browser.runtime.sendMessage({ type: 'EXPORT' });
      if (!resp.ok) return;
      exportArea.innerHTML = `
        <div class="sp-export">
          <div class="sp-export-section">
            <div class="sp-export-label">HTML 原型</div>
            <div class="sp-export-preview">${resp.html.length > 200 ? esc(resp.html.slice(0,200)) + '…' : esc(resp.html)}</div>
            <button class="sp-btn-secondary" id="btnCopyHtml">复制 HTML</button>
          </div>
          <div class="sp-export-section">
            <div class="sp-export-label">Spec YAML</div>
            <pre class="sp-yaml">${esc(resp.yaml || '(生成中…)')}</pre>
            <button class="sp-btn-secondary" id="btnCopyYaml">复制 YAML</button>
          </div>
          <div class="sp-export-actions">
            <button class="sp-btn-primary" id="btnNew">新建提取</button>
          </div>
        </div>`;
      document.getElementById('btnCopyHtml')?.addEventListener('click', () => {
        navigator.clipboard.writeText(resp.html);
        const btn = document.getElementById('btnCopyHtml');
        btn.textContent = '已复制 ✓';
        setTimeout(() => btn.textContent = '复制 HTML', 1500);
      });
      document.getElementById('btnCopyYaml')?.addEventListener('click', () => {
        navigator.clipboard.writeText(resp.yaml);
        const btn = document.getElementById('btnCopyYaml');
        btn.textContent = '已复制 ✓';
        setTimeout(() => btn.textContent = '复制 YAML', 1500);
      });
      document.getElementById('btnNew')?.addEventListener('click', () => {
        session = null;
        render();
      });
    }

    async function startSelection() {
      session = { status: 'extracting', rounds: [] };
      render();
      const [tab] = await browser.tabs.query({ active: true, currentWindow: true });
      browser.tabs.sendMessage(tab.id, { type: 'START_SELECTION' });
    }

    async function submitAnswer() {
      const inp = document.getElementById('answerInput');
      if (!inp?.value.trim()) return;
      sending = true;
      render();
      const resp = await browser.runtime.sendMessage({ type: 'ANSWER_ROUND', answer: inp.value });
      sending = false;
      if (resp.ok) { session = resp.session; render(); }
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Poll for session updates from background
    setInterval(async () => {
      const s = await browser.runtime.sendMessage({ type: 'GET_SESSION' });
      if (s && JSON.stringify(s) !== JSON.stringify(session)) {
        session = s;
        render();
      }
    }, 800);

    render();
  </script>
</body>
</html>
