<!DOCTYPE html>
<html lang="zh" data-host="sidepanel">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="manifest.open_at_install" content="false" />
  <title>原型操作台</title>
</head>
<body class="proto-body">
  <div class="proto-shell">

    <!-- 顶部栏 -->
    <header class="chat-head">
      <div>
        <span class="k">Prototype Agent</span>
        <h3 id="proto-headline">原型操作台</h3>
      </div>
      <div class="chat-head-right">
        <span class="status-pill run" id="proto-status" style="display:none">running</span>
        <button type="button" class="proto-settings-btn" id="btn-open-settings" title="连接设置">⚙</button>
      </div>
    </header>

    <!-- 连接设置（默认折叠） -->
    <div class="proto-bridge" id="agent-bridge" aria-label="Go Agent 连接" style="display:none">
      <div class="bridge-row">
        <label class="bridge-label" for="agent-base-url">Agent</label>
        <input class="bridge-input" id="agent-base-url" type="url" spellcheck="false" autocomplete="off" placeholder="http://127.0.0.1:33338" />
      </div>
      <div class="bridge-row">
        <label class="bridge-label" for="agent-workspace-root">工作区</label>
        <input class="bridge-input" id="agent-workspace-root" type="text" spellcheck="false" autocomplete="off" placeholder="C:\project\my-repo" />
      </div>
      <div class="bridge-actions">
        <button type="button" class="bridge-btn" id="btn-agent-save">保存</button>
        <button type="button" class="bridge-btn bridge-btn--primary" id="btn-agent-ping">连接</button>
      </div>
      <p class="bridge-status" id="agent-bridge-status">未连接</p>
    </div>

    <!-- 操作工具条 -->
    <div class="proto-toolbar" id="proto-toolbar">
      <button class="proto-tool-btn" id="btn-highlight" title="高亮页面元素">
        <span>✦</span><span>高亮</span>
      </button>
      <button class="proto-tool-btn" id="btn-annotate" title="显示/隐藏标注">
        <span>📍</span><span>标注</span>
      </button>
      <button class="proto-tool-btn" id="btn-onboard" title="引导演示">
        <span>🎯</span><span>引导</span>
      </button>
      <button class="proto-tool-btn" id="btn-refresh" title="刷新页面">
        <span>↻</span><span>刷新</span>
      </button>
    </div>

    <!-- 对话区 -->
    <section class="proto-chat" id="proto-chat" aria-label="Agent 对话">
      <div class="messages" id="agent-thread">
        <div class="proto-chat-hint">
          在下方输入自然语言要求，如：<br>
          · 拆解这个页面的布局区块<br>
          · 高亮导航区域并描述其结构<br>
          · 将侧栏改造为可折叠组件<br>
          · 在卡片区域加上加载状态
        </div>
      </div>
    </section>

    <!-- 底部输入 -->
    <div class="input-row" id="input-row">
      <div class="textarea-wrap">
        <textarea
          id="agent-input"
          class="chat-input"
          rows="3"
          placeholder="输入自然语言要求，/ 选择专业命令，Ctrl+Enter 发送…"
          spellcheck="false"
        ></textarea>
        <div id="slash-menu" class="slash-menu" role="listbox" aria-label="专业 agent 命令"></div>
      </div>
      <div class="input-actions">
        <span class="input-hint">Ctrl+Enter 发送 · / 专业命令</span>
        <button type="button" class="send-btn" id="agent-send" title="发送">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>

  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
